<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin</title>
  <style>
    /* Tema escuro no estilo do Axio Backoffice. As variáveis --t1/--t3/--grid… também servem às outras telas. */
    :root {
      color-scheme: dark;
      --bg: #0b0c0e; --rail: #0f1013; --panel: #131418; --panel-2: #17181d; --line: #22242a; --line-2: #2c2f36;
      --text: #f1f2f4; --muted: #8d929b; --accent: #22c55e; --accent-2: #16a34a;
      --green: #22c55e; --green-ink: #4ade80; --red: #ef4444; --red-ink: #f87171; --orange: #f59e0b;
      --t1: #f1f2f4; --t2: #b9bdc6; --t3: #8d929b; --grid: #22242a; --axis: #3a3d45; --surface-1: #131418;
      --pos: #3987e5; --neg: #e66767; --s1: #3987e5; --s2: #d95926; --good: #22c55e; --bad: #ef4444;
    }
    * { box-sizing: border-box; font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    code, pre { font-family: "JetBrains Mono", ui-monospace, monospace; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    h1 { font-size: 1rem; color: var(--text); margin: 0; }
    section#view { padding: 1.7rem 2.2rem 3rem; min-width: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
    .card { background: var(--panel); padding: 1rem; border-radius: 8px; border: 1px solid #1f2937; }
    .card span { color: var(--muted); font-size: 0.75rem; display: block; }
    .card strong { font-size: 1.4rem; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { border-bottom: 1px solid #1f2937; padding: 0.5rem; text-align: left; }
    #login { max-width: 380px; margin: 10vh auto; padding: 2rem 2rem 1.5rem; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
    #login[hidden] { display: none; }
    #login .login-logo { color: var(--green); margin-bottom: 1rem; } #login .login-logo svg { width: 40px; height: 40px; }
    #login h1 { font-size: 1.35rem; font-weight: 700; } #login .login-sub { color: var(--muted); font-size: .9rem; margin: .35rem 0 1.2rem; }
    #login .primary { width: 100%; margin-top: .4rem; }
    input { width: 100%; margin: 0.4rem 0 0.8rem; padding: 0.55rem 0.7rem; background: #0f1013; border: 1px solid var(--line-2); color: var(--text); border-radius: 8px; font-size: .9rem; }
    input:focus, select:focus { outline: none; border-color: var(--green); }
    .primary { background: var(--accent); color: #04140a; border: none; padding: 0.65rem 1.1rem; cursor: pointer; font-weight: 700; border-radius: 9px; font-size: .9rem; }
    .primary:hover { background: #2fd36b; }

    /* ---- Banners ---- */
    h2.sec { font-size: 1.35rem; font-weight: 700; color: var(--text); margin: 0.2rem 0 1rem; letter-spacing: -.2px; }
    select { width: 100%; margin: 0.4rem 0 0.8rem; padding: 0.55rem 0.6rem; background: #0f1013; border: 1px solid var(--line-2); color: var(--text); font-family: inherit; border-radius: 8px; }
    label.lbl { display: block; font-size: 0.72rem; color: var(--muted); margin: 0.5rem 0 0; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; max-width: 880px; }
    .form-grid .full { grid-column: 1 / -1; }
    .btn2 { background: #1f6feb; color: #fff; border: none; padding: 0.4rem 0.75rem; cursor: pointer; border-radius: 4px; font-size: 0.75rem; font-family: inherit; }
    .btn2.gray { background: #30363d; } .btn2.red { background: #da3633; } .btn2.ghost { background: transparent; border: 1px solid #30363d; color: var(--text); }
    .msg2 { font-size: 0.78rem; margin: 0.5rem 0; min-height: 1rem; color: var(--muted); }
    .bn-preview { margin: 0.6rem 0; border: 1px dashed #30363d; border-radius: 8px; overflow: hidden; max-width: 880px; }
    .bn-preview .pv { height: 150px; background-size: cover; background-position: center; display: flex; align-items: center; position: relative; }
    .bn-preview .pv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.55), transparent 60%); }
    .bn-preview .pv .pt { position: relative; z-index: 2; padding: 0 1.2rem; color: #fff; }
    .bn-preview .pv .pt h4 { margin: 0 0 0.3rem; font-size: 1.15rem; }
    .bn-preview .pv .pt p { margin: 0; font-size: 0.82rem; opacity: 0.9; }
    .bn-list { display: grid; gap: 0.6rem; margin-top: 1.2rem; max-width: 880px; }
    .bn-item { display: flex; gap: 0.8rem; align-items: center; background: var(--panel); border: 1px solid #1f2937; border-radius: 8px; padding: 0.6rem; }
    .bn-thumb { width: 130px; height: 58px; border-radius: 6px; background-size: cover; background-position: center; flex: none; border: 1px solid #1f2937; display: flex; align-items: flex-end; }
    .bn-thumb b { font-size: 0.6rem; color: #fff; padding: 2px 5px; text-shadow: 0 1px 4px #000; }
    .bn-meta { flex: 1; min-width: 0; } .bn-meta .t { font-weight: 600; font-size: 0.85rem; } .bn-meta .s { color: var(--muted); font-size: 0.72rem; }
    .tag { font-size: 0.6rem; padding: 1px 6px; border-radius: 999px; border: 1px solid #30363d; color: var(--muted); }
    .tag.on { color: var(--accent); border-color: var(--accent); } .tag.off { color: #f85149; border-color: #f85149; }

    /* ---- Provedores ---- */
    .hint { color: var(--muted); font-size: 0.78rem; margin: -0.4rem 0 1rem; max-width: 880px; }
    .pv-list { display: grid; gap: 0.7rem; max-width: 880px; }
    .pv-item { display: flex; gap: 1rem; align-items: flex-start; background: var(--panel); border: 1px solid #1f2937; border-radius: 8px; padding: 0.8rem; }
    .pv-logo { width: 56px; height: 56px; border-radius: 50%; flex: none; background: #fff; border: 1px solid #30363d; overflow: hidden;
      display: grid; place-items: center; color: #111; font-weight: 700; font-size: 1.2rem; }
    .pv-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
    .pv-body { flex: 1; min-width: 0; }
    .pv-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.9rem; }
    .pv-fields { display: grid; grid-template-columns: 1fr 2fr; gap: 0 0.8rem; }
    .pv-fields input { margin: 0.3rem 0 0.6rem; font-size: 0.8rem; }
    .pv-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .pv-actions label.btn2 { display: inline-block; }
    .pv-actions .msg2 { margin: 0; }
    .btn2:disabled { opacity: 0.45; cursor: default; }

    /* ---- Jogos ---- */
    .gm-toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 1.4rem 0 0.4rem; max-width: 880px; }
    .gm-toolbar input, .gm-toolbar select { width: auto; flex: 1 1 170px; margin: 0; font-size: 0.8rem; }
    .gm-count { flex: 1 0 100%; color: var(--muted); font-size: 0.75rem; }
    .gm-thumb { width: 84px; height: 63px; flex: none; border-radius: 6px; border: 1px solid #1f2937; background: #1a2230; object-fit: cover;
      display: grid; place-items: center; color: var(--accent); font-weight: 700; font-size: 0.95rem; }
    .gm-thumb.big { width: 128px; height: 96px; font-size: 1.4rem; }
    .gm-row.off { opacity: 0.55; }
    .img-row { display: flex; gap: 0.9rem; align-items: center; }
    .img-inputs { flex: 1; min-width: 0; }
    .chk { display: inline-flex; align-items: center; gap: 0.4rem; margin: 0.6rem 1.2rem 0 0; font-size: 0.8rem; color: var(--text); }
    .chk input { width: auto; margin: 0; }

    /* ---- Eventos ---- */
    .odds-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 1rem; }
    .ev-when { width: 62px; flex: none; text-align: center; background: #0d1117; border: 1px solid #1f2937; border-radius: 6px; padding: 0.4rem 0; line-height: 1.3; }
    .ev-when b { display: block; font-size: 0.85rem; } .ev-when span { font-size: 0.72rem; color: var(--muted); }
    .ev-row.off { opacity: 0.6; }
    .ev-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; max-width: 310px; }
    .ev-settle { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-top: 0.55rem; font-size: 0.75rem; color: var(--muted); }
    .ev-settle[hidden] { display: none; }
    .btn2.green { background: #238636; }

    /* ---- Integrações ---- */
    .code-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0; flex-wrap: wrap; }
    .code-row code { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 0.3rem 0.5rem; font-size: 0.75rem; color: var(--accent); word-break: break-all; }
    .int-meta { color: var(--muted); font-size: 0.75rem; margin: 0.3rem 0; }
    .howto { max-width: 880px; margin-top: 1rem; font-size: 0.78rem; color: var(--muted); border: 1px dashed #30363d; border-radius: 8px; padding: 0.8rem 1rem; }
    .howto b { color: var(--text); } .howto ol { margin: 0.4rem 0 0; padding-left: 1.2rem; } .howto li { margin: 0.2rem 0; }

    /* ---- Dashboard financeiro (paleta validada contra a superfície #121821) ---- */
    .viz-root { --surface-1: #121821; --t1: #e6edf3; --t2: #b1bac4; --t3: #8b949e; --grid: #1f2937; --axis: #3b4350;
      --pos: #3987e5; --neg: #e66767; --s1: #3987e5; --s2: #d95926; --good: #0ca30c; --bad: #e66767; }
    .dash { transition: opacity .15s; } .dash.loading { opacity: .5; }
    .dash-filters { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin: 0 0 1rem; }
    .chip { background: transparent; border: 1px solid #30363d; color: var(--text); padding: .35rem .75rem; border-radius: 999px; font: inherit; font-size: .75rem; cursor: pointer; }
    .chip:hover { background: rgba(255,255,255,.04); } .chip.on { border-color: var(--accent); color: var(--accent); }
    .dash-filters input[type=date] { width: auto; margin: 0; padding: .3rem .4rem; font-size: .75rem; color-scheme: dark; }
    .dash-period { color: var(--t3); font-size: .72rem; margin-left: auto; }
    .hero-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: .8rem; margin-bottom: .8rem; }
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: .8rem; }
    .tile { background: var(--panel); border: 1px solid #1f2937; border-radius: 8px; padding: .85rem 1rem; min-width: 0; }
    .tile .lbl { color: var(--t3); font-size: .72rem; }
    .tile .val { font-size: 1.3rem; font-weight: 600; color: var(--t1); margin: .3rem 0 .2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .val.hero { font-size: 3rem; line-height: 1.05; letter-spacing: -.02em; }
    .tile .sub { color: var(--t3); font-size: .7rem; margin-top: .2rem; }
    .tile .go { margin-top: .5rem; }
    .delta { font-size: .72rem; font-weight: 700; } .delta .vs { font-weight: 400; color: var(--t3); }
    .delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.neutral { color: var(--t2); }
    .sec-title { color: var(--t2); font-size: .74rem; margin: 1.5rem 0 .6rem; text-transform: uppercase; letter-spacing: .08em; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: .35rem 1rem; margin: .6rem 0 0; font-size: .8rem; }
    .kv dt { color: var(--t3); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--t1); }
    .card-title { margin: 0; font-size: .85rem; color: var(--t1); font-weight: 600; }
    .chart-card { background: var(--panel); border: 1px solid #1f2937; border-radius: 8px; padding: .85rem 1rem .6rem; min-width: 0; position: relative; }
    .chart-head { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .4rem; }
    .legend { display: flex; gap: .9rem; font-size: .7rem; color: var(--t2); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: .35rem; vertical-align: -1px; }
    .chart-head .btn2 { margin-left: auto; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; font-family: inherit; }
    .chart .hit { fill: transparent; cursor: crosshair; outline: none; }
    .chart .hit:focus-visible { stroke: var(--t3); stroke-width: 1; }
    .chart .col.dim { opacity: .45; }
    .viz-tip { position: absolute; pointer-events: none; z-index: 5; display: none; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: .45rem .6rem; font-size: .72rem; color: var(--t2); white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
    .viz-tip .when { color: var(--t3); margin-bottom: .2rem; }
    .viz-tip .r { display: flex; align-items: center; gap: .45rem; margin-top: .15rem; }
    .viz-tip .r b { color: var(--t1); font-size: .82rem; }
    .viz-tip .key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .75rem; font-variant-numeric: tabular-nums; }
    .data-table th { color: var(--t3); font-weight: 500; text-align: right; padding: .35rem .5rem; border-bottom: 1px solid #1f2937; }
    .data-table td { text-align: right; padding: .35rem .5rem; border-bottom: 1px solid #161d27; color: var(--t1); }
    .data-table th:first-child, .data-table td:first-child { text-align: left; }
    .data-table .muted { color: var(--t3); }
    .empty-note { color: var(--t3); font-size: .78rem; padding: .8rem 0; }
    .stack { display: grid; gap: .8rem; }
    .nav-h { color: var(--muted); font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; margin: .9rem .2rem .4rem; }
    .data-table.ops th, .data-table.ops td { text-align: left; }
    .data-table.ops .num { text-align: right; white-space: nowrap; }
    .data-table tr.clickable { cursor: pointer; }
    .data-table tr.clickable:hover td { background: rgba(255,255,255,.03); }
    .data-table tr.sel td { background: rgba(0,255,65,.06); }
    .ud-tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1rem 0 .4rem; }
    .legs { margin: 0; padding: 0; list-style: none; font-size: .72rem; color: var(--t2); }
    .legs li { white-space: nowrap; }
    .dot-s { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: .3rem; background: #e3b341; }
    .dot-s.WON { background: #0ca30c; } .dot-s.LOST { background: #e66767; } .dot-s.VOID { background: #8b949e; }
    .reject-row { display: flex; gap: .4rem; align-items: center; margin-top: .3rem; }
    .reject-row input { width: 14rem; margin: 0; padding: .3rem .4rem; font-size: .75rem; }
    pre.payload { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: .7rem; color: var(--t2); max-width: 420px; }
    .table-wrap { overflow-x: auto; margin-top: .4rem; }
    .linkish { background: none; border: 0; padding: 0; color: var(--text); font: inherit; cursor: pointer; text-align: left;
      text-decoration: underline dotted #4b5563; text-underline-offset: 3px; }
    .linkish:hover { color: var(--accent); text-decoration-color: currentColor; }
    .table-wrap .data-table td:first-child { white-space: nowrap; }
    @media (max-width: 1100px) { .hero-row, .two { grid-template-columns: 1fr; } }

    /* ═══════════ Casca no estilo Axio: barra de ícones + menu suspenso ═══════════ */
    #app { display: grid; grid-template-columns: 96px minmax(0, 1fr); min-height: 100vh; }
    #app[hidden] { display: none; }
    .rail { position: sticky; top: 0; height: 100vh; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 8px 14px; z-index: 30; }
    .rail-logo { display: grid; place-items: center; height: 46px; margin-bottom: 30px; color: var(--green); }
    .rail-logo svg { width: 34px; height: 34px; }
    .rail-nav, .rail-bottom { display: flex; flex-direction: column; gap: 8px; }
    .rail-bottom { margin-top: auto; }
    .rail-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; color: #9aa0a9; padding: 10px 2px; border-radius: 12px; cursor: pointer; font: inherit; font-size: 11.5px; }
    .rail-item svg { width: 22px; height: 22px; }
    .rail-item:hover { color: var(--text); background: rgba(255,255,255,.035); }
    .rail-item.active { color: var(--green-ink); }
    .rail-item.active svg { color: var(--green); }
    .rail-item:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
    .rail-dot { position: absolute; top: 5px; right: 24px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--rail); }
    .rail-dot[hidden] { display: none; }
    .flyout { position: fixed; z-index: 40; min-width: 230px; background: #16171c; border: 1px solid var(--line-2); border-radius: 12px; padding: 8px; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
    .flyout[hidden] { display: none; }
    .flyout h4 { margin: 4px 10px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
    .flyout button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: none; border: 0; color: var(--text); text-align: left; padding: 9px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13.5px; }
    .flyout button:hover, .flyout button:focus-visible { background: rgba(255,255,255,.06); outline: none; }
    .flyout button.active { color: var(--green-ink); background: rgba(34,197,94,.12); }
    .flyout .count { background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
    .flyout .acct { padding: 6px 10px 10px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .flyout .acct b { display: block; color: var(--text); font-size: 13.5px; margin-bottom: 2px; word-break: break-all; }

    /* ═══════════ Dashboard (modelo Axio) ═══════════ */
    .dsh { max-width: 1260px; }
    .dsh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.2rem; }
    .dsh-head h1 { font-size: 30px; font-weight: 700; letter-spacing: -.5px; margin: 0 0 6px; }
    .dsh-head p { margin: 0; color: var(--muted); font-size: 15px; }
    .dsh-btn { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line-2); color: var(--text); padding: 9px 14px; border-radius: 10px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .dsh-btn:hover { background: rgba(255,255,255,.04); }
    .dsh-btn svg { width: 16px; height: 16px; }
    .dsh-tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: #0f1013; margin-bottom: 14px; }
    .dsh-tab { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid transparent; color: #9aa0a9; padding: 8px 12px; border-radius: 9px; font: inherit; font-size: 14px; cursor: pointer; }
    .dsh-tab svg { width: 15px; height: 15px; opacity: .85; }
    .dsh-tab:hover { color: var(--text); }
    .dsh-tab.on { background: #1b1c21; color: var(--text); border-color: var(--line-2); }
    .dsh-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .seg { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: #0f1013; }
    .seg button.opt { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; color: #9aa0a9; padding: 7px 11px; border-radius: 8px; font: inherit; font-size: 13.5px; cursor: pointer; }
    .seg button.opt.on { background: #1d1e23; color: var(--text); }
    .flag { width: 15px; height: 15px; border-radius: 50%; overflow: hidden; display: inline-block; flex: none; }
    .flag svg { width: 100%; height: 100%; display: block; }
    .dsh-caption { color: var(--muted); font-size: 12.5px; margin: 10px 0 24px; min-height: 16px; }
    .dsh-body { transition: opacity .15s; } .dsh-body.loading { opacity: .5; }
    .dsh-sec { margin: 28px 0 14px; } .dsh-sec:first-child { margin-top: 0; }
    .dsh-sec h2 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
    .dsh-sec p { margin: 0; color: var(--muted); font-size: 13.5px; }
    .mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .mgrid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .mcard, .pcard { position: relative; background: radial-gradient(130% 120% at 100% 0%, var(--glow, transparent), transparent 55%), var(--panel); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
    .mcard { display: flex; gap: 16px; align-items: flex-start; padding: 22px 22px 20px; min-height: 126px; }
    .pcard { padding: 18px 18px 16px; min-height: 120px; }
    .tone-green { --tone: var(--green); --tone-bg: rgba(34,197,94,.16); --glow: rgba(34,197,94,.07); }
    .tone-gray { --tone: #b6bbc4; --tone-bg: rgba(255,255,255,.08); --glow: rgba(255,255,255,.025); }

    .gtip { position: fixed; z-index: 100; display: none; max-width: 300px; background: #1d1f25; border: 1px solid var(--line-2); color: #dfe2e7; font-size: 12.5px; line-height: 1.45; padding: 9px 11px; border-radius: 9px; box-shadow: 0 12px 30px rgba(0,0,0,.5); pointer-events: none; }

    .scard .s-ic { color: #b6bbc4; flex: none; } .scard .s-ic svg { width: 18px; height: 18px; display: block; }
    .scard .s-l { font-size: 11.5px; color: var(--muted); } .scard .s-v { font-size: 14.5px; font-weight: 700; margin-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .dtab th.sortable { cursor: pointer; user-select: none; } .dtab th.sortable:hover { color: var(--text); }
    .dtab .v-neg { color: var(--red-ink); } .dtab .muted { color: var(--muted); }

    .dsh-pop-wrap { position: relative; }

    .dsh-pop .range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dsh-pop label { font-size: 11.5px; color: var(--muted); }

    .chip-f { display: inline-flex; align-items: center; gap: 6px; background: rgba(34,197,94,.13); color: var(--green-ink); border: 0; border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
    /* Carteiras do agregador (mesmo desenho do painel da PlayFivers) */

    .aw-top b { font-size: 14.5px; }
    .aw-badge { background: #2bc4f4; color: #0b2230; font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }

    .aw-bar { height: 5px; border-radius: 999px; background: #2c323a; margin: 10px 0 12px; overflow: hidden; }

    .aw-report[hidden] { display: none; }
    .aw-report .dtab td, .aw-report .dtab th { padding: 7px 8px; } .aw-report .dtab th { border-top: 0; }
    .pm-wallets .dtab input { margin: 0; padding: 6px 8px; width: 100%; min-width: 90px; }
    .pm-wallets .dtab td { padding: 8px 10px; }
    @media (max-width: 1180px) { .mgrid.five { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 980px) { .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tgrid { grid-template-columns: 1fr; } }

<body>
  <div id="login">
    <div class="login-logo" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 3l14.7 8.5v17L20 37 5.3 28.5v-17z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M20 12v16M13.1 16l13.8 8M26.9 16l-13.8 8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <h1>Painel casaAPOSTA</h1>
    <p class="login-sub">Entre com sua conta da equipe.</p>
    <label class="lbl" for="email">E-mail</label>
    <input id="email" value="admin@lab.local" autocomplete="username" />
    <label class="lbl" for="password">Senha</label>
    <input id="password" type="password" value="Admin123!" autocomplete="current-password" />
    <button class="primary" id="btnLogin">Entrar</button>
    <p id="loginErr" style="color:#f87171;font-size:0.8rem"></p>
  </div>
  <div id="app" hidden>
    <aside class="rail" aria-label="Menu principal">
      <div class="rail-logo" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 3l14.7 8.5v17L20 37 5.3 28.5v-17z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M20 12v16M13.1 16l13.8 8M26.9 16l-13.8 8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></div>
      <nav class="rail-nav" id="rail_nav"></nav>
      <div class="rail-bottom" id="rail_bottom"></div>
    </aside>
    <aside class="subnav" id="subnav" hidden aria-label="Seções"></aside>
    <section id="view"></section>
  </div>
  <button type="button" class="sub-expand" id="subExpand" aria-label="Expandir menu" hidden>›</button>
  <div class="flyout" id="flyout" role="menu" hidden></div>
  <script>
    let token = localStorage.getItem("ca_admin_token") || "";
    const api = (path, opts = {}) =>
      fetch(path.startsWith("/api") ? path : `/api${path}`, {
        ...opts,
        // Content-Type só quando há corpo: DELETE/POST sem corpo com esse header eram recusados pelo Fastify.
        headers: { ...(opts.body ? { "Content-Type": "application/json" } : {}), Authorization: `Bearer ${token}`, ...(opts.headers || {}) },
      }).then(async (r) => {
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          const err = new Error((Array.isArray(j.issues) && j.issues.map((i) => i.message).join("; ")) || j.message || r.statusText);
          err.code = j.error; err.status = r.status;
          throw err;
        }
        return j;
      });

    // Cada aba pega um número; se o usuário já trocou de aba quando a resposta chega, ela não sobrescreve a tela.
    let viewSeq = 0;


    /* ----------------------------- Banners ----------------------------- */
    let editingBannerId = null;
    const $id = (id) => document.getElementById(id);
    const escA = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const DEFAULT_BG = "linear-gradient(120deg,#2a0a0e,#b31320)";
    const bnVal = (id) => $id(id).value.trim();

    // Destinos amigáveis do banner → valor gravado em ctaLink (string). "t" é o trecho
    // que identifica o destino ao reabrir um banner já salvo (ex.: #deposit casa com #deposito).
    const BN_DESTS = [
      { v: "", t: "", label: "Nenhum — banner sem link" },
      { v: "/app/#inicio", t: "#inicio", label: "Início" },
      { v: "/app/#esportes", t: "#esportes", label: "Esportes" },
      { v: "/app/#aovivo", t: "#aovivo", label: "Ao vivo" },
      { v: "/app/#cassino", t: "#cassino", label: "Cassino" },
      { v: "/app/#bilhetes", t: "#bilhetes", label: "Minhas apostas" },
      { v: "/app/#deposito", t: "#deposit", label: "Depósito" },
      { v: "/app/#cadastro", t: "#cadastro", label: "Cadastro / criar conta" },
      { v: "jogo", t: "", label: "Jogo específico do cassino…" },
      { v: "externa", t: "", label: "Página externa (URL)…" },
    ];
    let bnGames = [], bnPendingGame = "", bnGameSel = "";

    // ctaLink salvo → estado do seletor (destino / jogo / url).
    function bnParseDest(link) {
      link = (link || "").trim();
      if (!link || link === "#") return { dest: "", game: "", url: "" };
      const m = link.match(/#jogo:([^/?#\s]+)/i);
      if (m) return { dest: "jogo", game: m[1], url: "" };
      const low = link.toLowerCase();
      const hit = BN_DESTS.find((d) => d.t && low.includes(d.t));
      return hit ? { dest: hit.v, game: "", url: "" } : { dest: "externa", game: "", url: link };
    }
    // Mostra os campos extras conforme o destino escolhido.
    function bnSyncDest() {
      const d = $id("bn_dest") ? $id("bn_dest").value : "";
      if ($id("bn_gameRow")) $id("bn_gameRow").style.display = d === "jogo" ? "" : "none";
      if ($id("bn_urlRow")) $id("bn_urlRow").style.display = d === "externa" ? "" : "none";
    }
    // Seletor → ctaLink final.
    function bnComputeLink() {
      const d = $id("bn_dest").value;
      if (d === "jogo") return $id("bn_gameId").value ? `/app/#jogo:${$id("bn_gameId").value}` : "";
      if (d === "externa") return bnVal("bn_ctaLink");
      return d;
    }
    // Aplica um ctaLink salvo ao seletor (usado ao editar).
    function bnApplyLink(link) {
      const st = bnParseDest(link);
      if ($id("bn_dest")) $id("bn_dest").value = st.dest;
      if ($id("bn_ctaLink")) $id("bn_ctaLink").value = st.url;
      bnGameSel = st.dest === "jogo" ? st.game : "";
      if (st.dest === "jogo") { if (bnGames.length) bnFillGames(); else bnPendingGame = st.game; }
      bnSyncDest();
    }
    // Carrega os jogos do cassino para o seletor "jogo específico".
    let bnWalletOn = new Set();   // só jogos das carteiras habilitadas (os outros nem abrem)
    async function bnLoadGames() {
      const [games, wl] = await Promise.all([api("/admin/games").catch(() => []), api("/admin/casino/wallets").catch(() => null)]);
      bnGames = games;
      bnWalletOn = new Set(wl ? wl.settings.enabled : []);
      if (bnPendingGame) { bnGameSel = bnPendingGame; bnPendingGame = ""; }
      bnFillGames();
    }
    // São milhares de jogos: o seletor mostra até 200 resultados da busca, sempre com o jogo já escolhido.
    function bnFillGames() {
      const sel = $id("bn_gameId");
      if (!sel) return;
      const find = $id("bn_gameFind");
      if (find) find.oninput = bnFillGames;
      sel.onchange = () => { bnGameSel = sel.value; };
      if (!bnGames.length) { sel.innerHTML = `<option value="">Nenhum jogo — sincronize a PlayFivers</option>`; return; }
      const q = (find ? find.value : "").trim().toLowerCase();
      const cur = bnGameSel || sel.value;
      let list = bnGames.filter((g) => g.isActive && g.provider && bnWalletOn.has(g.provider.wallet)
        && (!q || g.name.toLowerCase().includes(q) || g.provider.name.toLowerCase().includes(q))).slice(0, 200);
      const chosen = cur && bnGames.find((g) => g.id === cur);
      if (chosen && !list.includes(chosen)) list = [chosen, ...list];
      sel.innerHTML = list.length
        ? list.map((g) => `<option value="${g.id}">${escA(g.name)}${g.provider ? " · " + escA(g.provider.name) : ""}</option>`).join("")
        : `<option value="">Nenhum jogo encontrado</option>`;
      if (chosen) sel.value = chosen.id;
    }

    function bnPreviewBg() {
      const img = bnVal("bn_imageUrl");
      return img ? `url("${encodeURI(img)}")` : (bnVal("bn_bgColor") || DEFAULT_BG);
    }
    function updateBnPreview() {
      const pv = $id("bn_pv");
      pv.style.background = bnPreviewBg();
      pv.style.backgroundSize = "cover";
      pv.style.backgroundPosition = "center";
      $id("bn_pvTitle").textContent = bnVal("bn_title") || "Título do banner";
      $id("bn_pvSub").textContent = bnVal("bn_subtitle") || "Subtítulo de exemplo";
    }
    function resetBnForm() {
      editingBannerId = null;
      ["bn_title", "bn_subtitle", "bn_ctaText", "bn_ctaLink", "bn_imageUrl", "bn_bgColor"].forEach((id) => ($id(id).value = ""));
      $id("bn_sortOrder").value = "0";
      $id("bn_placement").value = "MAIN";
      $id("bn_isActive").checked = true;
      $id("bn_file").value = "";
      bnPendingGame = "";
      if ($id("bn_dest")) $id("bn_dest").value = "";
      bnSyncDest();
      $id("bn_save").textContent = "Adicionar banner";
      $id("bn_cancel").style.display = "none";
      updateBnPreview();
    }
    function editBanner(b) {
      if (!b) return;
      editingBannerId = b.id;
      $id("bn_placement").value = b.placement;
      $id("bn_title").value = b.title || "";
      $id("bn_subtitle").value = b.subtitle || "";
      $id("bn_ctaText").value = b.ctaText || "";
      bnApplyLink(b.ctaLink || "");
      $id("bn_imageUrl").value = b.imageUrl || "";
      $id("bn_bgColor").value = b.bgColor || "";
      $id("bn_sortOrder").value = b.sortOrder;
      $id("bn_isActive").checked = b.isActive;
      $id("bn_save").textContent = "Salvar alterações";
      $id("bn_cancel").style.display = "";
      updateBnPreview();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    async function loadBnList() {
      const rows = await api("/admin/banners");
      const el = $id("bn_list");
      if (!el) return;   // usuário saiu da aba Banners antes da resposta
      if (!rows.length) { el.innerHTML = '<p style="color:var(--muted);font-size:.8rem">Nenhum banner cadastrado.</p>'; return; }
      el.innerHTML = rows.map((b) => {
        const bg = b.imageUrl ? `url('${encodeURI(b.imageUrl)}')` : (b.bgColor || DEFAULT_BG);
        return `<div class="bn-item">
          <div class="bn-thumb" style="background:${bg};background-size:cover;background-position:center"><b>${b.placement}</b></div>
          <div class="bn-meta">
            <div class="t">${escA(b.title) || "(sem título)"} <span class="tag ${b.isActive ? "on" : "off"}">${b.isActive ? "ativo" : "inativo"}</span></div>
            <div class="s">${escA(b.subtitle) || ""}${b.ctaText ? " · botão: " + escA(b.ctaText) : ""} · ordem ${b.sortOrder}</div>
          </div>
          <button class="btn2" data-edit="${b.id}">Editar</button>
          <button class="btn2 gray" data-toggle="${b.id}" data-active="${b.isActive}">${b.isActive ? "Desativar" : "Ativar"}</button>
          <button class="btn2 red" data-del="${b.id}">Excluir</button>
        </div>`;
      }).join("");
      el.querySelectorAll("[data-edit]").forEach((btn) => (btn.onclick = () => editBanner(rows.find((r) => r.id === btn.dataset.edit))));
      el.querySelectorAll("[data-toggle]").forEach((btn) => (btn.onclick = async () => {
        await api(`/admin/banners/${btn.dataset.toggle}`, { method: "PATCH", body: JSON.stringify({ isActive: btn.dataset.active !== "true" }) });
        loadBnList();
      }));
      el.querySelectorAll("[data-del]").forEach((btn) => (btn.onclick = async () => {
        if (!confirm("Excluir este banner? Esta ação não pode ser desfeita.")) return;
        await api(`/admin/banners/${btn.dataset.del}`, { method: "DELETE" });
        if (editingBannerId === btn.dataset.del) resetBnForm();
        loadBnList();
      }));
    }
    function showBanners() {
      viewSeq++;
      $id("view").innerHTML = `
        <h2 class="sec">Banners da home</h2>
        <div class="form-grid">
          <div><label class="lbl">Posição</label>
            <select id="bn_placement">
              <option value="MAIN">Carrossel principal (MAIN)</option>
              <option value="SIDE">Banner lateral (SIDE)</option>
            </select></div>
          <div><label class="lbl">Ordem (menor = primeiro)</label><input id="bn_sortOrder" type="number" value="0" /></div>
          <div><label class="lbl">Título</label><input id="bn_title" placeholder="O jogo começa aqui" /></div>
          <div><label class="lbl">Subtítulo</label><input id="bn_subtitle" placeholder="Super Odds · Super Múltipla" /></div>
          <div><label class="lbl">Para onde o banner leva?</label><select id="bn_dest"></select></div>
          <div id="bn_gameRow" style="display:none"><label class="lbl">Jogo do cassino</label><input id="bn_gameFind" placeholder="Buscar por nome ou provedor" style="margin-bottom:6px" /><select id="bn_gameId"></select></div>
          <div id="bn_urlRow" style="display:none"><label class="lbl">URL externa</label><input id="bn_ctaLink" placeholder="https://..." /></div>
          <div><label class="lbl">Texto do botão (opcional)</label><input id="bn_ctaText" placeholder="Apostar agora" /></div>
          <div class="full"><p style="margin:.1rem 0 0;color:var(--muted);font-size:.78rem">O banner inteiro fica clicável quando há um destino; o texto do botão é só um reforço visual.</p></div>
          <div class="full"><label class="lbl">Imagem de fundo (upload)</label><input id="bn_file" type="file" accept="image/*" />

      $id("bn_save").onclick = async () => {

    /* ---------------------------- Provedores ---------------------------- */
    let pvFlash = null;   // mensagem para mostrar no card depois de recarregar a lista

    function pvCard(p) {

    async function showProviders() {
      const my = ++viewSeq;

      $id("view").innerHTML = `
        <h2 class="sec">Provedores</h2>

      const list = $id("pv_list");

      if (pvFlash) {
        const c = list.querySelector(`[data-id="${CSS.escape(pvFlash.id)}"]`);

    /* ------------------------------ Jogos ------------------------------ */
    const GAME_CATS = [["slots", "Slots"], ["live", "Cassino ao vivo"], ["mesa", "Jogos de mesa"], ["crash", "Crash"]];
    const catLabel = (c) => (GAME_CATS.find(([k]) => k === c) || [c, c ? c.charAt(0).toUpperCase() + c.slice(1) : "—"])[1];
    const slugify = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const gmInitials = (n) => (n || "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
    const readAsDataURL = (file) => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = () => rej(new Error("Falha ao ler arquivo"));
      r.readAsDataURL(file);
    });
    let gmGames = [], gmProviders = [], gmEditing = null, gmSlugTouched = false, gmPage = 1;
    let gmWalletOn = new Set(), gmWalletNames = [];   // carteiras habilitadas na conta da PlayFivers
    const gmInSite = (g) => !!(g.provider && gmWalletOn.has(g.provider.wallet));
    const GM_PAGE = 50;   // o catálogo da PlayFivers tem milhares de jogos: a lista é paginada

    function gmThumb(url, name, big) {
      const cls = `gm-thumb${big ? " big" : ""}`;
      const fb = `<div class="${cls}">${escA(gmInitials(name))}</div>`;
      return url ? `<img class="${cls}" src="${escA(url)}" alt="" data-fb="${escA(fb)}" onerror="this.outerHTML=this.dataset.fb">` : fb;
    }
    const gmAllCats = () => [...new Set([...GAME_CATS.map(([k]) => k), ...gmGames.map((g) => g.category)])];

    function gmView() {
      const provOpts = gmProviders.map((p) => `<option value="${escA(p.slug)}">${escA(p.name)}</option>`).join("");
      return `<div id="gm_root">
        <h2 class="sec">Jogos</h2>
        <p class="hint">Todos os jogos vêm da <b>PlayFivers</b> (aba <b>Integrações</b> → Sincronizar jogos) e abrem no iframe dela.
          Aqui você ativa/desativa (um a um ou o provedor inteiro), marca <b>Em alta</b>, define a ordem dessa fileira e ajusta nome, categoria e capa.</p>
        <div id="g_form" hidden>
        <h3 style="margin:.2rem 0 .8rem;font-size:15px">Editar jogo</h3>
        <div class="form-grid">
          <div><label class="lbl">Nome</label><input id="g_name" placeholder="Fortune Tiger" maxlength="80" /></div>
          <div><label class="lbl">Slug (identificador único)</label><input id="g_slug" placeholder="fortune-tiger" maxlength="80" /></div>
          <div><label class="lbl">Provedor</label><select id="g_provider">${provOpts}</select></div>
          <div><label class="lbl">Categoria</label>
            <select id="g_category">${GAME_CATS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}<option value="__other">Outra…</option></select>
            <input id="g_catOther" placeholder="ex.: bingo" maxlength="40" style="display:none" /></div>
          <div class="full"><label class="lbl">Imagem do card (proporção 4:3, ex.: 400×300)</label>
            <div class="img-row">
              <div id="g_preview"></div>
              <div class="img-inputs">
                <input id="g_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" />
                <input id="g_imageUrl" placeholder="ou cole uma URL: /uploads/... ou https://..." />
              </div>
            </div></div>
          <div class="full">
            <label class="chk"><input id="g_live" type="checkbox" /> Ao vivo</label>
            <label class="chk"><input id="g_demo" type="checkbox" /> Demo disponível</label>
            <label class="chk"><input id="g_active" type="checkbox" /> Ativo (visível no site)</label>
          </div>
        </div>
        <div class="msg2" id="g_msg"></div>
        <button class="primary" id="g_save">Salvar alterações</button>
        <button class="btn2 ghost" id="g_cancel" style="margin-left:.5rem">Cancelar</button>
        </div>
        <div class="gm-feat" id="g_feat"></div>
        <div class="gm-toolbar">
          <input id="gf_q" placeholder="Buscar por nome ou código" />
          <select id="gf_prov"><option value="">Todos os provedores</option>${provOpts}</select>
          <select id="gf_cat"></select>
          <select id="gf_status"><option value="">Ativos e inativos</option><option value="on">Só ativos</option><option value="off">Só inativos</option></select>
          <select id="gf_feat"><option value="">Em alta e demais</option><option value="1">Só "Em alta"</option></select>
          <select id="gf_wallet"></select>
          <span class="gm-count" id="gf_count"></span>
        </div>
        <div class="gm-bulk" id="g_bulk" hidden></div>
        <div class="msg2" id="g_lmsg"></div>
        <div class="bn-list" id="g_list"></div>
        <div class="gm-pager" id="g_pager"></div>
      </div>`;
    }
    function gmRefreshCatFilter() {   // inclui categorias livres já usadas, mantendo a seleção
      const sel = $id("gf_cat"), cur = sel.value, cats = gmAllCats();
      sel.innerHTML = '<option value="">Todas as categorias</option>' + cats.map((c) => `<option value="${escA(c)}">${escA(catLabel(c))}</option>`).join("");
      sel.value = cats.includes(cur) ? cur : "";
    }
    const gmPreview = () => { $id("g_preview").innerHTML = gmThumb($id("g_imageUrl").value.trim(), $id("g_name").value, true); };

    function gmResetForm() {
      gmEditing = null; gmSlugTouched = false;
      ["g_name", "g_slug", "g_imageUrl", "g_catOther"].forEach((id) => ($id(id).value = ""));
      $id("g_provider").selectedIndex = 0;
      $id("g_category").value = "slots"; $id("g_catOther").style.display = "none";
      $id("g_live").checked = false; $id("g_demo").checked = false; $id("g_active").checked = true;
      $id("g_file").value = "";
      $id("g_msg").textContent = "";
      $id("g_form").hidden = true;
      gmPreview();
    }
    function gmEdit(g) {
      gmEditing = g.id; gmSlugTouched = true;
      $id("g_name").value = g.name; $id("g_slug").value = g.slug;
      $id("g_provider").value = g.provider ? g.provider.slug : "";
      const known = GAME_CATS.some(([k]) => k === g.category);
      $id("g_category").value = known ? g.category : "__other";
      $id("g_catOther").value = known ? "" : g.category;
      $id("g_catOther").style.display = known ? "none" : "";
      $id("g_live").checked = g.isLive; $id("g_demo").checked = g.hasDemo; $id("g_active").checked = g.isActive;
      $id("g_imageUrl").value = g.imageUrl || ""; $id("g_file").value = "";
      $id("g_msg").textContent = "";
      $id("g_form").hidden = false;
      gmPreview();
      window.scrollTo({ top: 0, behavior: "smooth" });

    async function gmUpload(e) {
      const f = e.target.files[0];
      if (!f) return;
      const msg = $id("g_msg"); msg.style.color = "var(--muted)"; msg.textContent = "Enviando imagem…";
      try {
        const out = await api("/admin/games/upload", { method: "POST", body: JSON.stringify({ dataUrl: await readAsDataURL(f) }) });
        $id("g_imageUrl").value = out.url;
        gmPreview();
        msg.style.color = "var(--accent)"; msg.textContent = "Imagem enviada ✓ — salve o jogo para aplicar";
      } catch (err) { msg.style.color = "#f85149"; msg.textContent = err.message; }
    }
    async function gmSave() {
      if (!gmEditing) return;   // não há cadastro manual: os jogos vêm da PlayFivers
      const msg = $id("g_msg"); msg.style.color = "var(--muted)"; msg.textContent = "Salvando…";
      const other = $id("g_category").value === "__other";
      const body = {
        name: $id("g_name").value.trim(),
        slug: $id("g_slug").value.trim(),
        providerSlug: $id("g_provider").value,
        category: other ? $id("g_catOther").value.trim() : $id("g_category").value,
        imageUrl: $id("g_imageUrl").value.trim(),
        isLive: $id("g_live").checked,
        hasDemo: $id("g_demo").checked,
        isActive: $id("g_active").checked,
      };
      const editing = gmEditing;
      try {
        const updated = await api(`/admin/games/${editing}`, { method: "PATCH", body: JSON.stringify(body) });
        const i = gmGames.findIndex((x) => x.id === editing);   // atualiza só este jogo (sem baixar o catálogo de novo)
        if (i >= 0) gmGames[i] = { ...gmGames[i], ...updated };
        gmResetForm();
        gmRefreshCatFilter();
        gmRenderList();
        gmSay(`${updated.name}: alterações salvas ✓`);
      } catch (err) { msg.style.color = "#f85149"; msg.textContent = err.message; }
    }
    function gmSay(text, ok = true) { const m = $id("g_lmsg"); if (!m) return; m.style.color = ok ? "var(--accent)" : "#f85149"; m.textContent = text; }
    const fmtN0 = (n) => Number(n).toLocaleString("pt-BR");
    const gmFeaturedList = () => gmGames.filter((g) => g.featured).sort((a, b) => a.sortOrder - b.sortOrder || a.name.localeCompare(b.name, "pt-BR"));
    function gmFiltered() {
      const q = $id("gf_q").value.trim().toLowerCase(), pf = $id("gf_prov").value, cf = $id("gf_cat").value, sf = $id("gf_status").value, ff = $id("gf_feat").value, wf = $id("gf_wallet").value;
      return gmGames.filter((g) =>
        (wf === "__on" ? gmInSite(g) : !wf || (g.provider && g.provider.wallet === wf)) &&
        (!q || g.name.toLowerCase().includes(q) || g.slug.includes(q) || (g.externalId || "").toLowerCase().includes(q)) &&
        (!pf || (g.provider && g.provider.slug === pf)) &&
        (!cf || g.category === cf) &&
        (!sf || (sf === "on" ? g.isActive : !g.isActive)) &&
        (!ff || g.featured));
    }
    const gmRow = (g) => `
        <div class="bn-item gm-row${g.isActive ? "" : " off"}">
          <button type="button" class="gm-star${g.featured ? " on" : ""}" data-star="${escA(g.id)}" title="${g.featured ? "Tirar de Em alta" : "Marcar Em alta"}" aria-pressed="${g.featured}" aria-label="${g.featured ? "Tirar de Em alta" : "Marcar Em alta"}">★</button>
          ${gmThumb(g.imageUrl, g.name)}
          <div class="bn-meta">
            <div class="t">${escA(g.name)} <span class="tag ${g.isActive ? "on" : "off"}">${g.isActive ? "ativo" : "inativo"}</span>${g.featured ? ' <span class="tag hot">Em alta</span>' : ""}${gmInSite(g) ? "" : ' <span class="tag off" title="A carteira deste provedor não está habilitada: não aparece no site">fora da conta</span>'}</div>
            <div class="s">${escA(g.provider ? g.provider.name : "—")} · ${escA(catLabel(g.category))}${g.isLive ? " · ao vivo" : ""} · <span style="opacity:.7">${escA(g.externalId || g.slug)}</span></div>
          </div>
          <button class="btn2" data-edit="${escA(g.id)}">Editar</button>
          <button class="btn2 gray" data-toggle="${escA(g.id)}">${g.isActive ? "Desativar" : "Ativar"}</button>
        </div>`;
    function gmRenderList() {
      const rows = gmFiltered(), pages = Math.max(1, Math.ceil(rows.length / GM_PAGE));
      if (gmPage > pages) gmPage = pages;
      const inSite = gmGames.filter((g) => g.isActive && gmInSite(g)).length;
      $id("gf_count").textContent = `${fmtN0(rows.length)} de ${fmtN0(gmGames.length)} jogos · ${fmtN0(inSite)} no site (ativos das carteiras habilitadas)`;
      const slice = rows.slice((gmPage - 1) * GM_PAGE, gmPage * GM_PAGE);
      const none = !gmWalletOn.size && $id("gf_wallet").value === "__on"
        ? '<p class="hint">Nenhuma carteira habilitada — o cassino do site está vazio. Habilite as carteiras da sua conta em <b>Integrações</b>.</p>'
        : '<p class="hint">Nenhum jogo com esses filtros.</p>';
      $id("g_list").innerHTML = slice.length ? slice.map(gmRow).join("") : none;
      $id("g_pager").innerHTML = pages > 1
        ? `<button type="button" class="btn2 gray" data-pg="${gmPage - 1}"${gmPage <= 1 ? " disabled" : ""}>‹ Anterior</button>
           <span>Página ${fmtN0(gmPage)} de ${fmtN0(pages)}</span>
           <button type="button" class="btn2 gray" data-pg="${gmPage + 1}"${gmPage >= pages ? " disabled" : ""}>Próxima ›</button>` : "";
      gmRenderBulk();
      gmRenderFeatured();
    }
    // Com um provedor filtrado: liga/desliga todos os jogos dele (ex.: manter só a versão "OFICIAL").
    function gmRenderBulk() {
      const pf = $id("gf_prov").value, box = $id("g_bulk");
      if (!pf) { box.hidden = true; box.innerHTML = ""; return; }
      const p = gmProviders.find((x) => x.slug === pf);
      const games = gmGames.filter((g) => g.provider && g.provider.slug === pf), on = games.filter((g) => g.isActive).length;
      box.hidden = false;
      box.innerHTML = `<span><b>${escA(p ? p.name : pf)}</b> · ${fmtN0(on)} de ${fmtN0(games.length)} ativos</span>
        <button type="button" class="btn2 green" data-bulk="1"${on === games.length ? " disabled" : ""}>Ativar todos deste provedor</button>
        <button type="button" class="btn2 red" data-bulk="0"${on === 0 ? " disabled" : ""}>Desativar todos deste provedor</button>`;
    }
    // Fileira "Em alta": é a primeira do cassino, nesta ordem.
    function gmRenderFeatured() {
      const list = gmFeaturedList();
      $id("g_feat").innerHTML = `<div class="gm-feat-h"><b>★ Em alta</b><span>${list.length

        + (list.length ? `<ol class="gm-feat-list">${list.map((g, i) => `<li>
            ${gmThumb(g.imageUrl, g.name)}<span class="nm">${escA(g.name)}<small>${escA(g.provider ? g.provider.name : "")}${g.isActive ? "" : " · inativo"}${gmInSite(g) ? "" : " · fora da conta (não aparece)"}</small></span>
            <button type="button" class="btn2 gray" data-fup="${escA(g.id)}"${i === 0 ? " disabled" : ""} aria-label="Subir ${escA(g.name)}">↑</button>
            <button type="button" class="btn2 gray" data-fdown="${escA(g.id)}"${i === list.length - 1 ? " disabled" : ""} aria-label="Descer ${escA(g.name)}">↓</button>
            <button type="button" class="btn2 gray" data-star="${escA(g.id)}" aria-label="Tirar ${escA(g.name)} de Em alta">✕</button></li>`).join("")}</ol>` : "");
    }
    // Ações da tela (lista, "Em alta", provedor e paginação). Atualiza o estado local em vez de baixar os milhares de jogos de novo.
    async function gmClick(e) {
      const b = e.target.closest("[data-edit],[data-toggle],[data-star],[data-fup],[data-fdown],[data-bulk],[data-pg]");
      if (!b || b.disabled) return;
      try {
        if (b.dataset.pg) { gmPage = Number(b.dataset.pg); gmRenderList(); $id("g_list").scrollIntoView({ block: "start" }); return; }
        if (b.dataset.bulk !== undefined) {
          const pf = $id("gf_prov").value, isActive = b.dataset.bulk === "1", p = gmProviders.find((x) => x.slug === pf);
          const ok = await CA.confirm({ title: isActive ? "Ativar provedor" : "Desativar provedor",
            message: `${isActive ? "Ativar" : "Desativar"} todos os jogos de ${p ? p.name : pf}? ${isActive ? "Eles passam a aparecer no site." : "Eles saem do site."}`,
            confirmLabel: isActive ? "Ativar todos" : "Desativar todos", danger: !isActive });
          if (!ok) return;
          const r = await api("/admin/games/bulk-active", { method: "POST", body: JSON.stringify({ providerSlug: pf, isActive }) });
          gmGames.forEach((g) => { if (g.provider && g.provider.slug === pf) g.isActive = isActive; });
          gmRenderList();
          return gmSay(`${fmtN0(r.count)} jogo(s) de ${p ? p.name : pf} ${isActive ? "ativados" : "desativados"}`);
        }
        const id = b.dataset.edit || b.dataset.toggle || b.dataset.star || b.dataset.fup || b.dataset.fdown;
        const g = gmGames.find((x) => x.id === id);
        if (!g) return;
        if (b.dataset.edit) return gmEdit(g);
        if (b.dataset.toggle) {
          await api(`/admin/games/${g.id}`, { method: "PATCH", body: JSON.stringify({ isActive: !g.isActive }) });
          g.isActive = !g.isActive;
          gmRenderList();
          return gmSay(`${g.name}: ${g.isActive ? "ativado (aparece no site)" : "desativado (saiu do site)"}`);
        }
        if (b.dataset.star) {
          const r = await api(`/admin/games/${g.id}/featured`, { method: "POST", body: JSON.stringify({ featured: !g.featured }) });
          g.featured = r.featured; g.sortOrder = r.sortOrder;
          gmRenderList();
          return gmSay(`${g.name} ${g.featured ? "entrou em" : "saiu de"} Em alta`);
        }
        const list = gmFeaturedList(), i = list.findIndex((x) => x.id === g.id), j = b.dataset.fup ? i - 1 : i + 1;
        if (i < 0 || j < 0 || j >= list.length) return;
        [list[i], list[j]] = [list[j], list[i]];
        await api("/admin/games/order", { method: "PUT", body: JSON.stringify({ ids: list.map((x) => x.id) }) });
        list.forEach((x, k) => (x.sortOrder = k));
        gmRenderList();
      } catch (err) { gmSay(err.message, false); }
    }
    async function showGames() {
      const my = ++viewSeq;
      $id("view").innerHTML = '<h2 class="sec">Jogos</h2><p class="hint">Carregando o catálogo…</p>';
      const [games, providers, wl] = await Promise.all([api("/admin/games"), api("/admin/providers"), api("/admin/casino/wallets").catch(() => null)]);
      if (my !== viewSeq) return;
      gmGames = games; gmProviders = providers; gmPage = 1;
      gmWalletOn = new Set(wl ? wl.settings.enabled : []);
      gmWalletNames = wl ? wl.wallets.map((w) => w.name) : [];
      $id("view").innerHTML = gmView();
      $id("gf_wallet").innerHTML = `<option value="__on">Só carteiras habilitadas</option><option value="">Todas as carteiras</option>`
        + gmWalletNames.map((w) => `<option value="${escA(w)}">${escA(w)}${gmWalletOn.has(w) ? " ✓" : ""}</option>`).join("");
      $id("g_name").addEventListener("input", () => {
        if (!gmEditing && !gmSlugTouched) $id("g_slug").value = slugify($id("g_name").value);
        gmPreview();
      });
      $id("g_slug").addEventListener("input", () => { gmSlugTouched = $id("g_slug").value.trim() !== ""; });
      $id("g_category").addEventListener("change", () => {
        const other = $id("g_category").value === "__other";
        $id("g_catOther").style.display = other ? "" : "none";
        if (other) $id("g_catOther").focus();
        if ($id("g_category").value === "live") $id("g_live").checked = true;
      });
      $id("g_imageUrl").addEventListener("input", gmPreview);
      $id("g_file").onchange = gmUpload;
      $id("g_save").onclick = gmSave;
      $id("g_cancel").onclick = () => { gmResetForm(); $id("g_msg").textContent = ""; };
      ["gf_q", "gf_prov", "gf_cat", "gf_status", "gf_feat", "gf_wallet"].forEach((id) => $id(id).addEventListener("input", () => { gmPage = 1; gmRenderList(); }));
      $id("gm_root").addEventListener("click", gmClick);   // o #gm_root é recriado a cada visita: o ouvinte não acumula
      gmRefreshCatFilter();
      gmResetForm();
      gmRenderList();
    }

    /* ----------------------- Pagamentos → Gateways ----------------------- */
    // Um gateway ativo por vez ("Usar este" = um clique); sem nenhum, o site fica no modo manual.
    // Credenciais no banco; segredos nunca voltam do servidor (só "salvo" e os 4 últimos caracteres).
    async function showGateways(flash) {
      const my = ++viewSeq;
      $id("view").innerHTML = `<div class="dsh"><div class="dsh-head"><div><h1>Gateways de pagamento</h1>
        <p>Escolha com um clique qual gateway processa os PIX do site. Sem nenhum ativo, depósitos e saques ficam no modo manual (a equipe aprova).</p></div></div>
        <div id="gw_body"><p class="hint">Carregando…</p></div></div>`;
      let v;
      try { v = await api("/admin/payments"); } catch (e) { if (my === viewSeq) $id("gw_body").innerHTML = `<div class="int-warn">${escA(e.message)}</div>`; return; }
      if (my !== viewSeq) return;
      renderGateways(v, flash);
    }
    const gwTag = (g) => `<span class="tag ${g.active ? "on" : g.configured ? "" : "off"}">${g.active ? "ativo" : g.configured ? "configurado" : "sem credenciais"}</span>`;
    function gwSay(id, text, ok = true) { const m = $id(id); if (!m) return; m.style.color = ok ? "var(--accent)" : "#f85149"; m.textContent = text; }
    function renderGateways(v, flash) {
      const act = v.gateways.find((g) => g.active);
      $id("gw_body").innerHTML = `
        <div class="tcard gw-mode${act ? " on" : ""}">
          <div class="gw-mode-txt"><b>${act ? `Ativo: ${escA(act.name)}` : "Modo manual"}</b>
            <span>${act ? "Depósitos geram PIX real nesse gateway e entram sozinhos pelo aviso dele; saques aprovados são pagos por ele."
              : "Depósitos geram um PIX simulado e a equipe aprova à mão em Operação → Depósitos e Saques."}</span></div>
          ${act ? '<button class="btn2 gray" id="gw_off">Voltar ao modo manual</button>' : ""}
        </div>
        <div class="msg2" id="gw_msg" role="status"></div>
        <div class="gw-grid">${v.gateways.map((g) => `
          <div class="tcard gw-card${g.active ? " active" : ""}">
            <div class="gw-top"><div class="gw-logo">${escA(g.name.slice(0, 2).toUpperCase())}</div>
              <div class="gw-name"><b>${escA(g.name)}</b><a href="${escA(g.site)}" target="_blank" rel="noopener">${escA(g.site.replace(/^https?:\/\//, ""))}</a></div>
              ${gwTag(g)}</div>
            <div class="gw-actions">
              ${g.active ? '<button class="primary" disabled>Em uso</button>'
                : `<button class="primary" data-gw-use="${g.key}"${g.configured ? "" : ' disabled title="Configure as credenciais primeiro"'}>Usar este</button>`}
              <button class="btn2 gray" data-gw-cfg="${g.key}">Configurar</button>
            </div>
          </div>`).join("")}</div>
        <div class="dsh-sec"><h2>URL pública do site</h2><p>Endereço público deste servidor (ex.: o túnel do cloudflared). Com ele montamos a URL de aviso (webhook) que os gateways chamam — precisa ser https.</p></div>
        <div class="tcard in-card">
          <div class="in-grid"><div class="full"><label class="lbl" for="gw_base">URL pública</label>
            <input id="gw_base" value="${escA(v.publicBaseUrl)}" placeholder="https://seu-dominio.com" spellcheck="false" />
            <div class="in-help">${v.publicBaseUrl ? "" : "⚠ Vazia: os gateways não conseguem avisar quando o PIX cai. "}Ao trocar de túnel, atualize aqui e no painel do gateway.</div></div></div>
          <div class="msg2" id="gw_base_msg" role="status"></div>
          <div class="in-actions"><button class="primary" id="gw_base_save">Salvar URL</button></div>
        </div>`;
      if (flash) gwSay("gw_msg", flash.text, flash.ok !== false);
      const body = $id("gw_body");
      body.querySelectorAll("[data-gw-use]").forEach((b) => (b.onclick = () => gwSetActive(b.dataset.gwUse, b)));
      body.querySelectorAll("[data-gw-cfg]").forEach((b) => (b.onclick = () => goView("gateway", b.dataset.gwCfg)));
      const off = $id("gw_off"); if (off) off.onclick = () => gwSetActive(null, off);
      $id("gw_base_save").onclick = gwSaveBase;
    }
    async function gwSetActive(key, btn) {
      if (!key) {
        const ok = await CA.confirm({ title: "Voltar ao modo manual",
          message: "Os próximos depósitos vão gerar PIX simulado e precisar de aprovação manual. Pedidos já criados no gateway continuam recebendo os avisos dele.",
          confirmLabel: "Voltar ao manual" });
        if (!ok) return;
      }
      if (btn) btn.disabled = true;
      try {
        const v = await api("/admin/payments/active", { method: "PUT", body: JSON.stringify({ active: key }) });
        const g = v.gateways.find((x) => x.key === key);
        renderGateways(v, { text: key ? `${g ? g.name : "Gateway"} ativado ✓ — os próximos PIX passam por ele.` : "Modo manual ativado." });
      } catch (e) { if (btn) btn.disabled = false; gwSay("gw_msg", e.message, false); }
    }
    async function gwSaveBase() {
      const btn = $id("gw_base_save"); btn.disabled = true; gwSay("gw_base_msg", "Salvando…");
      try {
        const v = await api("/admin/payments/settings", { method: "PUT", body: JSON.stringify({ publicBaseUrl: $id("gw_base").value.trim() }) });
        renderGateways(v); gwSay("gw_base_msg", "URL salva ✓");
      } catch (e) { btn.disabled = false; gwSay("gw_base_msg", e.message, false); }
    }

      $id("gwc_back").onclick = () => goView("gateways");

      if (my !== viewSeq) return;

      $id("gwc_title").textContent = g.name;

      const field = (f) => `<div><label class="lbl" for="gwf_${f.key}">${escA(f.label)}${f.required ? "" : " <small>(opcional)</small>"}</label>

      $id("gwc_body").innerHTML = `
        <div class="tcard in-card">

            ${g.active ? "" : `<button class="btn2 green" id="gwc_use"${g.configured ? "" : " disabled"}>Usar este gateway</button>`}
            ${g.configured ? '<button class="btn2 red" id="gwc_clear">Remover credenciais</button>' : ""}
          </div>
        </div>
        <div class="dsh-sec"><h2>Aviso de pagamento (webhook)</h2><p>${escA(g.webhookHelp)}</p></div>

          ${/^https:\/\//.test(v.publicBaseUrl || "") ? "" : '<div class="int-warn">⚠ Defina a URL pública (https) em Pagamentos → Gateways — sem ela o gateway não consegue avisar quando o PIX cai.</div>'}
        </div>`;
      if (flash) gwSay("gwc_msg", flash.text, flash.ok !== false);
      $id("gwc_save").onclick = () => gwcSave(g);

      const u = $id("gwc_use"); if (u) u.onclick = async () => {
        u.disabled = true;

          const nv = await api("/admin/payments/active", { method: "PUT", body: JSON.stringify({ active: g.key }) });
          renderGatewayConfig(nv.gateways.find((x) => x.key === g.key), nv, { text: `${g.name} ativado ✓ — os próximos PIX passam por ele.` });

      };
      const c = $id("gwc_clear"); if (c) c.onclick = () => gwcClear(g);
      $id("gwc_body").querySelectorAll("[data-copy-url]").forEach((b) => (b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.copyUrl); gwSay("gwc_msg", "URL copiada ✓"); } catch { gwSay("gwc_msg", "Não deu para copiar — selecione o texto", false); }
      }));

    async function gwcSave(g) {
      const btn = $id("gwc_save"); btn.disabled = true; gwSay("gwc_msg", "Salvando…");
      const values = {};
      $id("gwc_body").querySelectorAll("[data-gwf]").forEach((i) => { values[i.dataset.gwf] = i.value; });

      try {

    const BR_ICON_SVG = '<svg class="br-ic" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z" fill="#f5333f" fill-opacity="0.18" stroke="#ec2440" stroke-width="1.7"/><path d="M12 7v10M7.5 9.5l9 5M16.5 9.5l-9 5" stroke="#ffc83d" stroke-width="1.7" stroke-linecap="round"/></svg>';

    let brSaved = null, brForm = null;
    const brPick = (b) => Object.fromEntries(BR_FIELDS.map((k) => [k, b[k]]));
    const brDirty = () => !!brSaved && BR_FIELDS.some((k) => brForm[k] !== brSaved[k]);

    // Mesmo desenho do topo do site (src/services/brand.ts → brandMarkup); no celular a imagem vai até 30 px.
    function brLogoHTML(b, { dark = false, mobile = false } = {}) {

    function brSlot(key, title, help, kind) {

    async function showBrand() {
      const my = ++viewSeq;
      $id("view").innerHTML = `<div class="dsh"><div class="dsh-head"><div><h1>Marca</h1>
        <p>Nome, logo e ícone do site. Valem para o topo do site, a aba do navegador, a prévia de links (WhatsApp, Telegram), este painel e as faturas.</p></div></div>
        <div id="br_body"><p class="hint">Carregando…</p></div></div>`;
      let v;
      try { v = await api("/admin/site/brand"); } catch (e) { if (my === viewSeq) $id("br_body").innerHTML = `<div class="int-warn">${escA(e.message)}</div>`; return; }
      if (my !== viewSeq) return;
      brSaved = v; brForm = brPick(v);
      renderBrand();

    function renderBrand(flash) {
      const v = brSaved, b = brForm;

      $id("br_body").innerHTML = `

        <div class="tcard in-card">
          <div class="in-status"><span class="tag ${v.updatedAt ? "on" : "off"}">${v.updatedAt ? "marca própria" : "padrão"}</span><span>${when}</span></div>
