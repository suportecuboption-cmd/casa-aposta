            <div><label class="lbl" for="br_wordB">Logo em texto — parte 2</label><input id="br_wordB" maxlength="24" value="${escA(b.wordB)}" placeholder="ex.: APOSTA" />
              <div class="in-help">Na cor de destaque do site. As duas em branco = usa o nome do site.</div></div>
            <div class="full">${brSlot("logoUrl", "Imagem da logo", "PNG, SVG, WEBP ou JPG, de preferência com fundo transparente. A borda vazia em volta é cortada sozinha.", "logo")}</div>
            <div class="full">${brSlot("logoDarkUrl", "Logo para o tema escuro (opcional)", "Use se a logo for escura e sumir no fundo escuro. Sem ela, a mesma imagem vale para os dois temas.", "logo")}</div>
            <div class="full${b.logoUrl ? "" : " br-dim"}"><label class="lbl" for="br_h">Altura da logo no topo: <b id="br_h_out">${b.logoHeight} px</b></label>
              <input id="br_h" type="range" min="18" max="64" step="1" value="${b.logoHeight}"${b.logoUrl ? "" : " disabled"} />
              <div class="in-help">${b.logoUrl ? "No celular ela fica com no máximo 30 px." : "Vale para a imagem da logo."}</div></div>
            <div class="full">${brSlot("iconUrl", "Ícone", "Quadrado (ex.: 512×512). Vira o ícone da aba (favicon), do atalho no celular e deste painel, e aparece ao lado do texto da logo.", "icon")}</div>
            <div class="full"><label class="lbl" for="br_support">Link do botão Suporte</label><input id="br_support" maxlength="300" spellcheck="false" value="${escA(b.supportUrl || "")}" placeholder="ex.: https://wa.me/5511999999999" />
              <div class="in-help">Aparece no menu do celular (WhatsApp, Telegram ou página de atendimento). Em branco, o botão não aparece.</div></div>
          </div>
          <div class="msg2" id="br_msg" role="status"></div>
          <div class="in-actions">
            <button class="primary" id="br_save">Salvar marca</button>
            <button class="btn2 gray" id="br_undo">Desfazer alterações</button>
            <a class="btn2 gray" href="/app/" target="_blank" rel="noopener">Abrir o site ↗</a>
            <span class="br-dirty" id="br_dirty" hidden>alterações não salvas</span>
          </div>
        </div>`;
      brPreview(); brSync();
      if (flash) brSay(flash.text, flash.ok !== false);
      const body = $id("br_body");
      [["br_name", "name"], ["br_wordA", "wordA"], ["br_wordB", "wordB"], ["br_support", "supportUrl"]].forEach(([id, k]) =>
        ($id(id).oninput = (e) => { brForm[k] = e.target.value; brPreview(); brSync(); }));
      $id("br_h").oninput = (e) => { brForm.logoHeight = Number(e.target.value); $id("br_h_out").textContent = `${brForm.logoHeight} px`; brPreview(); brSync(); };
      body.querySelectorAll("[data-up]").forEach((inp) => (inp.onchange = () => brUpload(inp)));
      body.querySelectorAll("[data-rm]").forEach((btn) => (btn.onclick = () => {
        brForm[btn.dataset.rm] = null;
        if (btn.dataset.rm === "logoUrl") brForm.logoDarkUrl = null;   // sem logo não há versão escura
        renderBrand();
      }));
      $id("br_save").onclick = brSave;
      $id("br_undo").onclick = () => { brForm = brPick(brSaved); renderBrand({ text: "Alterações desfeitas." }); };
    }
    function brSync() {
      const d = brDirty();
      $id("br_save").disabled = !d || !String(brForm.name || "").trim();
      $id("br_undo").disabled = !d;
      $id("br_dirty").hidden = !d;
    }
    function brSay(text, ok = true) { const m = $id("br_msg"); if (!m) return; m.style.color = ok ? "var(--accent)" : "#f85149"; m.textContent = text; }
    async function brUpload(inp) {
      const f = inp.files && inp.files[0]; inp.value = "";
      if (!f) return;
      if (f.size > 6 * 1024 * 1024) return brSay("Imagem muito grande (máx. 6 MB).", false);
      brSay("Enviando a imagem…");
      try {
        const r = await api("/admin/site/brand/upload", { method: "POST", body: JSON.stringify({ kind: inp.dataset.kind, dataUrl: await readAsDataURL(f) }) });
        brForm[inp.dataset.up] = r.url;
        renderBrand({ text: "Imagem pronta — confira a prévia e clique em Salvar marca." });
      } catch (e) { brSay(e.message, false); }
    }
    async function brSave() {
      const btn = $id("br_save"); btn.disabled = true; brSay("Salvando…");
      try {
        const v = await api("/admin/site/brand", { method: "PUT", body: JSON.stringify({ ...brForm, name: String(brForm.name || "").trim(), supportUrl: String(brForm.supportUrl || "").trim() }) });
        brSaved = v; brForm = brPick(v);
        applyAdminBrand(v);
        renderBrand({ text: "Marca salva ✓ — o site já abre com ela." });
      } catch (e) { brSay(e.message, false); btn.disabled = false; }
    }

    async function showInstall() {
      const my = ++viewSeq;
      $id("view").innerHTML = `<div class="dsh"><div class="dsh-head"><div><h1>Instalação</h1>
        <p>Configuração do servidor guardada no banco de dados — nada disso fica no <code>.env</code>. Só administradores acessam.</p></div></div>
        <div id="in_body"><p class="hint">Carregando…</p></div></div>`;
      let v;
      try { v = await api("/admin/install"); } catch (e) { if (my === viewSeq) $id("in_body").innerHTML = `<div class="int-warn">${escA(e.message)}</div>`; return; }
      if (my !== viewSeq) return;
      renderInstall(v);
    }
    function renderInstall(v, flash) {
      const p = v.playfivers;
      const when = v.updatedAt ? `Última alteração: ${escA(fmtDateTime(v.updatedAt))}${v.updatedByEmail ? " por " + escA(v.updatedByEmail) : ""}` : "Ainda não configurado.";
      const secretField = (id, label, set, hint, help) => `<div><label class="lbl" for="${id}">${label}</label>
          <input id="${id}" type="password" autocomplete="new-password" spellcheck="false" placeholder="${set ? escA(hint) + " salvo — em branco mantém" : "cole aqui"}" />
          <div class="in-help">${help}</div></div>`;
      $id("in_body").innerHTML = `
        <div class="dsh-sec"><h2>PlayFivers (cassino)</h2><p>Credenciais do seu agente. Com elas os jogos abrem valendo, a carteira é movida pelos webhooks e as carteiras habilitadas da conta são lidas sozinhas.</p></div>
        <div class="tcard in-card">
          <div class="in-status"><span class="tag ${p.configured ? "on" : "off"}">${p.configured ? "credenciais salvas" : "sem credenciais"}</span><span>${when}</span></div>
          <div class="in-grid">
            <div class="full"><label class="lbl" for="in_base">URL da API</label><input id="in_base" value="${escA(p.baseUrl)}" spellcheck="false" />
              <div class="in-help">Padrão: https://api.playfivers.com</div></div>
            ${secretField("in_token", "Token do agente", p.agentTokenSet, p.agentTokenHint, "Painel da PlayFivers → dados do agente.")}
            ${secretField("in_secret", "Segredo do agente", p.secretKeySet, p.secretKeyHint, "Também confere o <code>agent_secret</code> dos webhooks.")}
            <div><label class="lbl" for="in_code">Código do agente</label><input id="in_code" value="${escA(p.agentCode)}" spellcheck="false" placeholder="ex.: AGENTE123" />
              <div class="in-help">Vem como <code>agent_code</code> no webhook de transação. Vazio = confere só o segredo.</div></div>
            <div><label class="lbl" for="in_ips">IPs da PlayFivers (webhooks)</label><textarea id="in_ips" rows="2" spellcheck="false" placeholder="ex.: 1.2.3.4, 5.6.7.8">${escA(p.ipAllowlist)}</textarea>
              <div class="in-help">Vazio = aceita de qualquer IP (o segredo continua obrigatório).</div></div>
          </div>
          <div class="msg2" id="in_msg" role="status"></div>
          <div class="in-actions">
            <button class="primary" id="in_save">Salvar e testar conexão</button>
            <button class="btn2 gray" id="in_test"${p.configured ? "" : " disabled"}>Testar conexão</button>
            ${p.configured ? '<button class="btn2 red" id="in_clear">Remover credenciais</button>' : ""}
          </div>
        </div>
        <div class="dsh-sec"><h2>Callback URL do agente</h2><p>Cole esta URL no campo <b>Callback URL</b> do agente, no painel da PlayFivers — ela recebe o saldo, as apostas e os estornos.</p></div>
        <div class="tcard in-card">${(v.webhooks || []).map((w) => `<div class="code-row">${escA(w.label)}: <code>${escA(w.url)}</code>
          <button class="btn2 gray" data-copy-url="${escA(w.url)}">Copiar</button></div>`).join("")}</div>`;
      if (flash) inSay(flash.text, flash.ok !== false);
      $id("in_save").onclick = installSave;
      const t = $id("in_test"); if (t) t.onclick = () => installTest(false);
      const c = $id("in_clear"); if (c) c.onclick = installClear;
      $id("in_body").querySelectorAll("[data-copy-url]").forEach((b) => (b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.copyUrl); inSay("URL copiada ✓"); } catch { inSay("Não deu para copiar — selecione o texto", false); }
      }));
    }
    function inSay(text, ok = true) { const m = $id("in_msg"); if (!m) return; m.style.color = ok ? "var(--accent)" : "#f85149"; m.textContent = text; }
    async function installSave() {
      const btn = $id("in_save"); btn.disabled = true; inSay("Salvando…");
      const body = { baseUrl: $id("in_base").value.trim(), agentCode: $id("in_code").value.trim(), agentToken: $id("in_token").value, secretKey: $id("in_secret").value, ipAllowlist: $id("in_ips").value };
      try {
        const v = await api("/admin/install/playfivers", { method: "PUT", body: JSON.stringify(body) });
        renderInstall(v, { text: "Salvo ✓" });   // redesenha: token e segredo somem da tela
        if (v.playfivers.configured) await installTest(true);
      } catch (e) { inSay(e.message, false); btn.disabled = false; }
    }
    async function installTest(afterSave) {
      inSay(afterSave ? "Salvo ✓ — testando a conexão com a PlayFivers…" : "Testando a conexão com a PlayFivers…");
      try {
        const r = await api("/admin/install/playfivers/test", { method: "POST" });
        const w = r.wallets;
        const wTxt = w && w.enabled ? (w.enabled.length ? ` · carteiras da conta: ${w.enabled.join(", ")}` : " · nenhuma carteira da conta casou com o catálogo") : w && w.error ? ` · carteiras: ${w.error}` : "";
        inSay(`Conectado ✓ — agente OK (RTP ${r.agent.rtp}%)${wTxt}`);
      } catch (e) { inSay(`${afterSave ? "Salvo, mas a conexão falhou" : "Falha na conexão"}: ${e.message}`, false); }
    }
    async function installClear() {
      const ok = await CA.confirm({ title: "Remover credenciais",
        message: "Apagar o token, o segredo e o código do agente? Os jogos param de abrir e os webhooks de transação passam a ser recusados.",
        confirmLabel: "Remover", danger: true });
      if (!ok) return;
      try { const v = await api("/admin/install/playfivers", { method: "PUT", body: JSON.stringify({ clearCredentials: true }) }); renderInstall(v, { text: "Credenciais removidas." }); }
      catch (e) { inSay(e.message, false); }
    }

    /* --------------------------- Integrações --------------------------- */
    const fmtDateTime = (iso) => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    function intCard(a) {
      const r = a.lastSyncResult;
      const last = a.lastSync
        ? `${fmtDateTime(a.lastSync)}${r ? ` — ${r.total} no catálogo · ${r.created} novos · ${r.updated} atualizados · ${r.deactivated} desativados` : ""}`
        : "nunca";
      // URLs dos webhooks de carteira que a PlayFivers chama (cadastrar no painel dela).
      const urlRows = (a.webhooks || []).map((w) => `<div class="code-row">${escA(w.label)}: <code>${escA(w.url)}</code>
            <button class="btn2 gray" data-act="copy">Copiar</button></div>`).join("");
      const n = (v) => Number(v || 0).toLocaleString("pt-BR");
      return `<div class="pv-item" data-key="${escA(a.key)}">
        <div class="pv-body">
          <div class="pv-top"><strong>${escA(a.name)}</strong>
            <span class="tag ${a.configured ? "on" : "off"}">${a.configured ? "credenciais ok" : "sem credenciais"}</span>
            <span class="tag">${escA(a.key)}</span></div>
          <div class="int-meta">${n(a.games)} jogos (${n(a.activeGames)} ativos) · ${n(a.sessions24h)} aberturas de jogo nas últimas 24 h</div>
          ${a.configured ? "" : `<div class="int-warn">⚠ O catálogo sincroniza mesmo assim (é público), mas os jogos só abrem depois de configurar o token e o segredo do agente em <b>Ajustes → Instalação</b>.
            <button class="btn2" data-act="install">Configurar</button></div>`}
          ${urlRows}
          <div class="int-meta">Cole essa URL no campo "Callback URL" do agente, no painel da PlayFivers.</div>
          <div class="int-meta">Última sincronização: ${escA(last)}</div>
          <div class="pv-actions"><button class="btn2 green" data-act="sync">Sincronizar jogos</button>
            <span class="msg2" data-msg></span></div>
        </div>
      </div>`;
    }
    /* ---------- Carteiras habilitadas: o site mostra só o que a conta da PlayFivers cobre ---------- */
    function walletPanelHTML(o) {
      const s = o.settings, n = (v) => Number(v || 0).toLocaleString("pt-BR");
      const on = o.wallets.filter((w) => w.enabled);
      const src = s.source === "playfivers"
        ? `Lidas da PlayFivers em ${escA(fmtDateTime(s.checkedAt))}.${s.unmatched && s.unmatched.length ? ` ⚠ Carteiras da conta sem jogos no catálogo: ${escA(s.unmatched.join(", "))}.` : ""}`
        : s.source === "manual" ? "Escolhidas manualmente aqui no admin." : "";
      return `<div class="howto wl-box">
        <b>Carteiras habilitadas na sua conta</b>
        <p class="int-meta">O site mostra só os jogos dos provedores destas carteiras da PlayFivers.
          ${on.length ? `Habilitadas: <b>${on.length}</b> · ${n(on.reduce((t, w) => t + w.activeGames, 0))} jogos no site.` : "<b>Nenhuma habilitada — o cassino do site está vazio.</b>"} ${src}</p>
        <div class="wl-list">${o.wallets.map((w) => `<label class="wl-item${w.enabled ? " on" : ""}">
            <input type="checkbox" data-wallet="${escA(w.name)}"${w.enabled ? " checked" : ""} />
            <span class="wl-main"><b>${escA(w.name)}</b>
              <small>${w.providers.length} provedor${w.providers.length === 1 ? "" : "es"} · ${n(w.games)} jogos${w.balance != null ? ` · saldo ${moneyIn(w.balance, "BRL")}` : ""}</small>
              <small class="wl-provs">${escA(w.providers.slice(0, 6).map((p) => p.name).join(", "))}${w.providers.length > 6 ? ` e mais ${w.providers.length - 6}` : ""}</small></span>
          </label>`).join("")}</div>
        <div class="pv-actions">
          <button class="btn2 green" data-wact="save">Salvar seleção</button>
          <button class="btn2" data-wact="detect"${o.configured ? "" : " disabled"}>Detectar pela PlayFivers</button>
          <span class="msg2" data-wmsg></span></div>
        ${o.configured
          ? '<div class="int-meta">A cada "Sincronizar jogos" as carteiras da conta são lidas de novo na PlayFivers.</div>'
          : '<div class="int-meta">A detecção automática usa o token do agente, configurado em <b>Ajustes → Instalação</b>. Enquanto ele não estiver salvo, marque aqui as carteiras que vocês têm.</div>'}
      </div>`;
    }
    /* ---------- Capas dos jogos: baixadas e reduzidas no nosso servidor ---------- */
    let imgPoll = null;
    async function loadImagePanel() {
      const box = $id("img_panel");
      if (!box) return; // saiu da tela: para de acompanhar
      let s;
      try { s = await api("/admin/games/images"); } catch (e) { box.innerHTML = `<div class="int-warn">${escA(e.message)}</div>`; return; }
      if (!$id("img_panel")) return;
      const j = s.job, n = (v) => Number(v || 0).toLocaleString("pt-BR");
      box.innerHTML = `<div class="howto img-box"><b>Capas dos jogos</b>
        <p class="int-meta">As capas da CDN da PlayFivers pesam ~125 KB cada. Aqui elas são baixadas uma vez, reduzidas para miniatura (~25 KB) e servidas pelo nosso servidor com cache — a vitrine carrega bem mais rápido.</p>
        <p class="int-meta"><b>${n(s.local)}</b> no servidor · <b>${n(s.remote)}</b> ainda na CDN${s.missing ? ` · <b>${n(s.missing)}</b> sem capa na PlayFivers (o card mostra o nome)` : ""} — jogos que aparecem no site</p>
        ${s.missing ? `<p class="int-meta">⚠ Vários provedores da PlayFivers apontam para capas que não existem na CDN deles (dá 404). Vale pedir ao suporte da PlayFivers; se mandarem URLs novas, o "Sincronizar jogos" baixa sozinho.</p>` : ""}
        ${j.running ? `<div class="img-bar"><i style="width:${Math.round(((j.done + j.missing + j.failed) / Math.max(j.total, 1)) * 100)}%"></i></div><p class="int-meta">Baixando… ${n(j.done + j.missing + j.failed)} de ${n(j.total)} · ${n(j.done)} prontas${j.missing ? ` · ${n(j.missing)} sem capa` : ""}${j.failed ? ` · ${n(j.failed)} com erro` : ""}</p>`
          : j.finishedAt ? `<p class="int-meta">Última execução: ${n(j.done)} baixadas${j.missing ? ` · ${n(j.missing)} sem capa na CDN` : ""}${j.failed ? ` · ${n(j.failed)} com erro (continuam na CDN — dá para tentar de novo)` : ""} · ${escA(fmtDateTime(j.finishedAt))}</p>` : ""}
        <div class="pv-actions"><button class="btn2 green" id="img_go"${j.running || !s.remote ? " disabled" : ""}>${j.running ? "Baixando…" : s.remote ? `Baixar ${n(s.remote)} capas` : "Todas no servidor ✓"}</button>
          <span class="msg2" id="img_msg"></span></div>
      </div>`;
      const go = $id("img_go");
      if (go) go.onclick = async () => {
        go.disabled = true;
        try { await api("/admin/games/images/download", { method: "POST" }); } catch (e) { const m = $id("img_msg"); if (m) m.textContent = e.message; }
        loadImagePanel();
      };
      clearTimeout(imgPoll);
      if (j.running) imgPoll = setTimeout(loadImagePanel, 2000);
    }

    async function loadWalletPanel(okText) {
      const box = $id("wl_panel");
      if (!box) return;
      let o;
      try { o = await api("/admin/casino/wallets"); } catch (e) { box.innerHTML = `<div class="int-warn">${escA(e.message)}</div>`; return; }
      box.innerHTML = walletPanelHTML(o);
      if (okText) { const m = box.querySelector("[data-wmsg]"); m.style.color = "var(--accent)"; m.textContent = okText; }
      box.onchange = (e) => { const i = e.target.closest("[data-wallet]"); if (i) i.closest(".wl-item").classList.toggle("on", i.checked); };
      box.onclick = async (e) => {
        const b = e.target.closest("[data-wact]");
        if (!b || b.disabled) return;
        const m = box.querySelector("[data-wmsg]");
        m.style.color = "var(--muted)"; m.textContent = b.dataset.wact === "save" ? "Salvando…" : "Consultando a PlayFivers…"; b.disabled = true;
        try {
          if (b.dataset.wact === "save") {
            const enabled = [...box.querySelectorAll("[data-wallet]:checked")].map((i) => i.dataset.wallet);
            await api("/admin/casino/wallets", { method: "PUT", body: JSON.stringify({ enabled }) });
            await loadWalletPanel(`Salvo ✓ — ${enabled.length} carteira(s) no site`);
          } else {
            const r = await api("/admin/casino/wallets/detect", { method: "POST" });
            await loadWalletPanel(`Detectado ✓ — ${r.settings.enabled.length} carteira(s) da sua conta`);
          }
        } catch (err) { m.style.color = "#f85149"; m.textContent = err.message; b.disabled = false; }
      };
    }

    async function showIntegrations() {
      const my = ++viewSeq;
      const rows = await api("/admin/integrations");
      if (my !== viewSeq) return;
      $id("view").innerHTML = `
        <h2 class="sec">Integrações de cassino</h2>
        <p class="hint">Todo o cassino vem da <b>PlayFivers</b>: o catálogo (provedores, jogos e capas) pela API e cada jogo abre no iframe dela.
          A carteira é movida pelos webhooks (saldo, aposta/prêmio e estorno) — é isso que alimenta o GGR e o RTP do dashboard.
          Sincronizar de novo traz jogos novos e desativa os que saíram, mantendo o que você ajustou (ativo/inativo, categoria, capa, "Em alta" e ordem).</p>
        <div class="pv-list" id="int_list">${rows.map(intCard).join("")}</div>
        <div id="wl_panel"><p class="hint">Carregando as carteiras…</p></div>
        <div id="img_panel"></div>
        <div class="howto"><b>Para os jogos abrirem valendo</b>
          <ol><li>Configurar o token e o segredo do agente em <b>Ajustes → Instalação</b>. <button class="btn2" data-goinstall>Configurar</button></li>
            <li>Cadastrar o IP do servidor no painel da PlayFivers.</li>
            <li>Colar a Callback URL mostrada acima no campo "Callback URL" do agente.</li>
            <li>Recomendado: em <b>Ajustes → Instalação</b>, preencher os IPs da PlayFivers, para só eles conseguirem chamar os webhooks.</li></ol></div>`;
      loadWalletPanel();
      loadImagePanel();
      $id("view").querySelectorAll("[data-goinstall]").forEach((b) => (b.onclick = () => goView("install")));
      $id("int_list").addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn || btn.disabled) return;
        if (btn.dataset.act === "install") return goView("install");
        const card = btn.closest(".pv-item"), msg = card.querySelector("[data-msg]");
        if (btn.dataset.act === "copy") {
          const code = (btn.closest(".code-row") || card).querySelector("code");
          try { await navigator.clipboard.writeText(code.textContent); msg.style.color = "var(--accent)"; msg.textContent = "Copiado ✓"; }
          catch { msg.style.color = "#f85149"; msg.textContent = "Não deu para copiar — selecione o texto"; }
          return;
        }
        msg.style.color = "var(--muted)"; msg.textContent = "Sincronizando…"; btn.disabled = true;
        try {
          const r = await api(`/admin/integrations/${card.dataset.key}/sync`, { method: "POST" });
          await showIntegrations();
          const m = $id("int_list").querySelector(`[data-key="${CSS.escape(card.dataset.key)}"] [data-msg]`);
          if (m) {
            const w = r.wallets;
            const wTxt = w && w.enabled ? ` · carteiras da conta: ${w.enabled.length}` : w && w.error ? ` · carteiras: ${w.error}` : "";
            m.style.color = w && w.error ? "#fbbf24" : "var(--accent)";
            m.textContent = `Pronto: ${r.total} no catálogo · ${r.created} novos · ${r.updated} atualizados · ${r.deactivated} desativados${r.providersCreated ? ` · ${r.providersCreated} provedores novos` : ""}${wTxt}`;
          }
        } catch (err) { msg.style.color = "#f85149"; msg.textContent = err.message; btn.disabled = false; }
      });
    }

    /* --------------------------- PlayFivers --------------------------- */

    function evRenderList() {
      const q = $id("ef_q").value.trim().toLowerCase(), st = $id("ef_status").value, lg = $id("ef_league").value;
      const t = (e) => new Date(e.startsAt).getTime();
      const rows = evList
        .filter((e) =>
          (!q || [e.homeTeam, e.awayTeam, e.league].some((v) => v.toLowerCase().includes(q))) &&
          (st === "" || (st === "open" ? evOpen(e) : st === "live" ? evIsLive(e) : e.status === st)) &&
          (!lg || e.league === lg))
        // abertos primeiro (mais próximos antes); encerrados/cancelados depois (mais recentes antes)
        .sort((a, b) => (evOpen(b) - evOpen(a)) || (evOpen(a) ? t(a) - t(b) : t(b) - t(a)));
      $id("ef_count").textContent =
        `${rows.length} de ${evList.length} eventos · ${evList.filter(evOpen).length} abertos · ${evList.filter(evIsLive).length} ao vivo`;

    async function evListClick(ev) {
      const btn = ev.target.closest("button");
      if (!btn || btn.disabled) return;
      const row = btn.closest(".ev-row");
      const e = row && evList.find((x) => x.id === row.dataset.id);
      if (!e) return;
      const act = btn.dataset.act, outcome = btn.dataset.outcome, panel = row.querySelector(".ev-settle");
      const name = `${e.homeTeam} × ${e.awayTeam}`;
      if (act === "edit") return evEdit(e);
      if (act === "settle") { panel.hidden = !panel.hidden; return; }
      if (act === "settle-close") { panel.hidden = true; return; }
      try {
        if (act === "live") {
          await api(`/admin/events/${e.id}`, { method: "PATCH", body: JSON.stringify({ isLive: !evIsLive(e) }) });
          evSay(`${name}: ${evIsLive(e) ? "saiu do ao vivo" : "agora ao vivo"}`);
        } else if (outcome) {
          const label = outcome === "draw" ? "empate" : `vitória do ${outcome === "home" ? e.homeTeam : e.awayTeam}`;
          if (!confirm(`Encerrar ${name} com ${label}?\nOs bilhetes serão liquidados e os ganhadores pagos. Não dá para desfazer.`)) return;
          const r = await api(`/admin/events/${e.id}/settle`, { method: "POST", body: JSON.stringify({ outcome }) });
          evSay(`${name} encerrado (${label}): ${r.settledSelections} seleções · ${r.slipsWon} bilhetes pagos · ${r.slipsLost} perdidos`
            + (r.slipsStillOpen ? ` · ${r.slipsStillOpen} acumuladas seguem abertas` : ""));
        } else if (act === "cancel") {
          if (!confirm(`Cancelar ${name}?\nAs seleções viram nulas: apostas simples são devolvidas e acumuladas seguem sem essa perna. Não dá para desfazer.`)) return;
          const r = await api(`/admin/events/${e.id}/cancel`, { method: "POST" });
          evSay(`${name} cancelado: ${r.voidedSelections} seleções anuladas · ${r.slipsRefunded} apostas devolvidas`
            + (r.slipsWon ? ` · ${r.slipsWon} acumuladas pagas` : "")
            + (r.slipsStillOpen ? ` · ${r.slipsStillOpen} acumuladas seguem abertas` : ""));
        } else if (act === "del") {
          if (!confirm(`Excluir ${name} de vez?`)) return;
          await api(`/admin/events/${e.id}`, { method: "DELETE" });
          if (evEditing === e.id) evResetForm();
          evSay(`${name} excluído`);
        } else return;
        await evReload();
      } catch (err) { evSay(err.message, false); }

    /* ══════════════════════ Dashboard (modelo Axio Backoffice) ══════════════════════
       Mesmas definições e fórmulas do guia do Axio (seção 8 — base de cálculo): período no fuso de
       São Paulo; se inclui hoje, termina AGORA; o "período anterior" tem a mesma duração, logo antes.
       Turnover = Σ apostas · Payout = Wins + Refunds · GGR = Turnover − Payout · divisão por zero = 0. */

    // Formatadores compartilhados com outras telas (Utilizadores, PIX).
    const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const BRLc = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", notation: "compact", maximumFractionDigits: 1 });
    const brl = (v) => (Math.abs(v || 0) >= 100000 ? BRLc : BRL).format(v || 0);
    const pctf = (v, d = 1) => (v == null ? "—" : (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%");
    const intf = (v) => Number(v || 0).toLocaleString("pt-BR");
    const ddmm = (ymd) => `${ymd.slice(8, 10)}/${ymd.slice(5, 7)}`;
    const spToday = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    const addDaysYmd = (ymd, n) => { const d = new Date(ymd + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const tile = (label, value, { sub = "", d = "", hero = false, extra = "" } = {}) =>
      `<div class="tile"><div class="lbl">${label}</div><div class="val${hero ? " hero" : ""}">${value}</div>${d ? `<div>${d}</div>` : ""}${sub ? `<div class="sub">${sub}</div>` : ""}${extra}</div>`;

    /* ── ícones (traço, 24×24) ── */
    const svgI = (p, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? "currentColor" : "none"}" stroke="${fill ? "none" : "currentColor"}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
    const DI = {
      trend: svgI('<path d="M3 17l6-6 4 4 7-8"/><path d="M14 7h6v6"/>'),
      bars: svgI('<path d="M5 20v-6M12 20V8M19 20V4"/><path d="M3 20h18"/>'),
      bag: svgI('<path d="M8 3h8l-2 4h-4z"/><path d="M10 7c-4 2-6 6-6 9 0 3 3 5 8 5s8-2 8-5c0-3-2-7-6-9"/><path d="M12 11v6M10.3 12.6c0-.7.8-1.2 1.7-1.2s1.7.5 1.7 1.2-.8 1-1.7 1.2-1.7.5-1.7 1.2.8 1.2 1.7 1.2 1.7-.5 1.7-1.2"/>'),

      joystick: svgI('<path d="M6 11h4M8 9v4M15 10.5h.01M18 12.5h.01"/><path d="M17.3 5H6.7A4.7 4.7 0 0 0 2 9.7v3.6A3.7 3.7 0 0 0 5.7 17c1 0 2-.5 2.6-1.3L9.5 14h5l1.2 1.7a3.2 3.2 0 0 0 2.6 1.3 3.7 3.7 0 0 0 3.7-3.7V9.7A4.7 4.7 0 0 0 17.3 5z"/>'),

    };

    /* ── estado, período e cache ── */
    const DSH_TABS = [
      ["overview", "Visão Geral", DI.grid], ["payments", "Pagamentos", DI.card], ["wallet", "Carteira & Moedas", DI.wallet],
      ["casino", "Cassino & Jogadores", DI.pie], ["providers", "Provedores", DI.db], ["games", "Jogos", DI.joystick], ["sports", "Esportes", DI.ball],
    ];
    const DSH_PRESETS = [["today", "Hoje"], ["yesterday", "Ontem"], ["7d", "Últimos 7 dias"], ["30d", "Últimos 30 dias"], ["month", "Este mês"], ["lastmonth", "Mês passado"]];
    function dshRange(p) {
      const t = spToday();
      if (p === "yesterday") { const y = addDaysYmd(t, -1); return { from: y, to: y }; }
      if (p === "7d") return { from: addDaysYmd(t, -6), to: t };
      if (p === "30d") return { from: addDaysYmd(t, -29), to: t };
      if (p === "month") return { from: t.slice(0, 8) + "01", to: t };
      if (p === "lastmonth") { const end = addDaysYmd(t.slice(0, 8) + "01", -1); return { from: end.slice(0, 8) + "01", to: end }; }
      return { from: t, to: t };
    }
    let dsh = { tab: "overview", mode: "native", cur: "BRL", preset: "today", ...dshRange("today"), games: { q: "", provs: null, label: "", sort: "turnover", dir: -1 } };
    let dshLast = {};
    const dshCache = new Map();
    function dshLoad(kind) {
      const q = `?from=${dsh.from}&to=${dsh.to}&mode=${dsh.mode}&cur=${dsh.cur}`;
      const key = kind + q;
      if (!dshCache.has(key)) {
        const p = api(`/admin/dash/${kind}${q}`);
        dshCache.set(key, p);
        p.catch(() => dshCache.delete(key));
      }
      return dshCache.get(key);
    }

    /* ── definições dos indicadores (tooltip "?"), do guia ── */
    const DEF = {
      ggr: "Gross Gaming Revenue (Apostas − Prêmios). Cálculo: Turnover − Payout.",
      turnover: "Total apostado no período no contexto de moeda ativo. Cálculo: soma de todas as apostas.",
      netCashflow: "Fluxo de caixa líquido entre depósitos e saques. Cálculo: Depósitos (Net) − Saques (Net).",
      wallet: "Total em carteira dos jogadores AGORA (não depende do período). É dinheiro de terceiros sob custódia.",
      signups: "Novos usuários cadastrados no período.",
      active: "Usuários que entraram no período: login ou sessão aberta (registro no máximo a cada 15 min).",
      depNet: "Volume líquido de depósitos completados no período. Cálculo: soma de (valor − taxa).",
      wdNet: "Volume líquido de saques completados no período. Cálculo: soma de (valor − taxa).",

      depVol: "Soma líquida dos depósitos completados (valor − taxa).",
      depTicket: "Valor médio de cada depósito. Cálculo: Volume líquido ÷ Completados.",
      depositors: "Usuários únicos com depósito completado no período.",
      ftdShare: "Percentual de depositantes do período que eram FTD. Cálculo: FTDs ÷ Depositantes únicos.",
      ftdNet: "Volume líquido dos primeiros depósitos feitos no período.",
      ftdTicket: "Valor médio do primeiro depósito. Cálculo: Net dos FTDs ÷ FTDs.",

      wdVol: "Soma líquida dos saques completados (valor − taxa).",
      wdTicket: "Valor médio por saque concluído. Cálculo: Volume líquido ÷ Completados.",
      withdrawers: "Usuários únicos com saque concluído no período.",
      available: "Saldo que os jogadores podem usar ou sacar agora (contas ativas).",
      blocked: "Saldo que não pode ser usado agora: bônus e saldo de contas bloqueadas.",
      walletTotal: "Disponível + Bloqueado. É sempre o saldo de agora.",
      bets: "Número de apostas (rodadas) feitas no cassino.",
      winsCount: "Quantidade de créditos de prêmio no período (só prêmios maiores que zero).",
      wins: "Valor total de prêmios pagos.",
      rtp: "Percentual devolvido aos jogadores no período. Cálculo: Payout ÷ Turnover.",
      arpu: "Receita média por usuário ativo. Cálculo: GGR ÷ Usuários ativos.",
      arppu: "Receita média por usuário pagante. Cálculo: GGR ÷ Pagantes ativos.",
      wdRatio: "Razão entre saques e depósitos líquidos. Abaixo de 100%: entra mais do que sai. Acima: a operação paga mais saques do que recebe.",
      mode: "USD Geral: todas as moedas somadas, convertidas pela cotação dos Parâmetros. Nativa: só as operações feitas na moeda escolhida, sem conversão.",
    };

    /* ── formatação ── */
    const symOf = (cur) => (cur === "USD" ? "US$" : cur === "BRL" ? "R$" : cur);
    const moneyIn = (v, cur) => (v == null ? "—" : `${v < 0 ? "-" : ""}${symOf(cur)} ${Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`);
    const money = (v) => moneyIn(v, dsh.cur);
    const pct = (v, d = 1) => (v == null ? "—" : (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%");
    const int = (v) => Number(v || 0).toLocaleString("pt-BR");
    const num2 = (v) => Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const dmy = (ymd) => `${ymd.slice(8, 10)}/${ymd.slice(5, 7)}/${ymd.slice(0, 4)}`;
    const spDT = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const spT = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" });
    function dshCaption(P) {
      const f = (iso) => spDT.format(new Date(iso)).replace(",", "");
      return `${f(P.start)} → ${P.live ? `agora (${spT.format(new Date(P.end))})` : f(P.end)} · comparado com ${f(P.prevStart)} → ${f(P.prevEnd)} (mesma duração, logo antes)`;
    }

    // Variação vs período anterior: (atual − anterior) ÷ |anterior|; cor pela direção, como no Axio.
    function dshDelta(cur, prev) {
      if (cur == null || prev == null) return "";
      const vs = '<span>vs. período anterior</span>';
      if (!cur && !prev) return `<span class="pill zero">0,0%</span>${vs}`;
      if (!prev) return `<span class="pill zero">novo</span>${vs}`;
      const ch = (cur - prev) / Math.abs(prev);
      if (Math.abs(ch) < 0.0005) return `<span class="pill zero">0,0%</span>${vs}`;
      const up = ch > 0;
      const txt = (Math.abs(ch) * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
      return `<span class="pill ${up ? "up" : "down"}">${up ? ARROW_UP : ARROW_DOWN} ${txt}</span>${vs}`;
    }

    /* ── dica "?" única, posicionada na tela (não corta dentro dos cards) ── */
    const gtip = document.createElement("div");
    gtip.className = "gtip"; gtip.id = "gtip"; gtip.setAttribute("role", "tooltip");
    document.body.append(gtip);
    function showTip(btn) {
      gtip.textContent = btn.dataset.tip;
      gtip.style.display = "block";
      const r = btn.getBoundingClientRect(), w = gtip.offsetWidth, h = gtip.offsetHeight;
      const left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8));
      const top = r.bottom + 8 + h > innerHeight - 8 ? r.top - h - 8 : r.bottom + 8;
      gtip.style.left = left + "px"; gtip.style.top = top + "px";
    }
    function hideTip() { gtip.style.display = "none"; }
    document.addEventListener("mouseover", (e) => { const b = e.target.closest(".tip-btn"); if (b) showTip(b); });
    document.addEventListener("mouseout", (e) => { if (e.target.closest(".tip-btn")) hideTip(); });
    document.addEventListener("focusin", (e) => { const b = e.target.closest(".tip-btn"); if (b) showTip(b); else hideTip(); });
    const tipBtn = (text, label) => (text ? `<button type="button" class="tip-btn" data-tip="${escA(text)}" aria-describedby="gtip" aria-label="${escA("O que é " + (label || ""))}">?</button>` : "");

    /* ── blocos de tela ── */

        <div class="mc-body"><div class="mc-lbl">${escA(label)}${tipBtn(tip, label)}</div><div class="mc-val">${value}</div>${delta ? `<div class="mc-delta">${delta}</div>` : ""}</div>
      </div>`;
    const pcard = ({ label, tip, value, icon, tone = "green", delta = "" }) => `<div class="pcard tone-${tone}">

        <div class="mc-val">${value}</div>${delta ? `<div class="mc-delta">${delta}</div>` : ""}
      </div>`;
    const scard = (label, value, icon) => `<div class="scard"><div class="s-ic">${icon}</div><div><div class="s-l">${escA(label)}</div><div class="s-v">${value}</div></div></div>`;
    function tbl(title, sub, heads, rows, foot, full) {
      const body = rows.length
        ? rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")
        : `<tr><td colspan="${heads.length}" class="muted">Sem dados no período.</td></tr>`;
      return `<div class="tcard${full ? " full" : ""}"><div class="tcard-h"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</div>
        <div class="tscroll"><table class="dtab"><thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody>${foot ? `<tfoot><tr>${foot.map((c) => `<td>${c}</td>`).join("")}</tr></tfoot>` : ""}</table></div></div>`;
    }
    const ggrCell = (v, cur) => `<span class="${v < 0 ? "v-neg" : ""}">${cur ? moneyIn(v, cur) : money(v)}</span>`;

    /* ── abas ── */
    function dshOverview(S) {
      const c = S.current, p = S.previous;
      return dshSec("Métricas Principais", "Principais indicadores executivos da operação no período selecionado.") + `<div class="mgrid">
          ${mcard({ label: "Casino GGR", tip: DEF.ggr, value: money(c.casino.ggr), icon: DI.trend, delta: dshDelta(c.casino.ggr, p.casino.ggr) })}
          ${mcard({ label: "Turnover Total", tip: DEF.turnover, value: money(c.casino.turnover), icon: DI.bars, tone: "gray", delta: dshDelta(c.casino.turnover, p.casino.turnover) })}
          ${mcard({ label: "Net Cashflow", tip: DEF.netCashflow, value: money(c.payments.netCashflow), icon: DI.bag, delta: dshDelta(c.payments.netCashflow, p.payments.netCashflow) })}
          ${mcard({ label: "Saldo em carteira", tip: DEF.wallet, value: money(S.wallet.total), icon: DI.wallet, tone: "orange" })}
          ${mcard({ label: "Cadastros", tip: DEF.signups, value: int(c.users.signups), icon: DI.user, tone: "gray", delta: dshDelta(c.users.signups, p.users.signups) })}
          ${mcard({ label: "Usuários Ativos", tip: DEF.active, value: int(c.users.active), icon: DI.users, delta: dshDelta(c.users.active, p.users.active) })}
        </div>` + dshSec("Pulso do negócio", "Leitura rápida do que mudou no funil, receita e base ativa.") + `<div class="mgrid">
          ${pcard({ label: "Depósitos (Net)", tip: DEF.depNet, value: money(c.payments.deposits.net), icon: DI.cash, delta: dshDelta(c.payments.deposits.net, p.payments.deposits.net) })}
          ${pcard({ label: "Saques (Net)", tip: DEF.wdNet, value: money(c.payments.withdrawals.net), icon: DI.play, tone: "orange", delta: dshDelta(c.payments.withdrawals.net, p.payments.withdrawals.net) })}
          ${pcard({ label: "Pagamento do cassino", tip: DEF.payout, value: money(c.casino.payout), icon: DI.coins, tone: "gray", delta: dshDelta(c.casino.payout, p.casino.payout) })}
          ${pcard({ label: "Pagantes ativos", tip: DEF.paying, value: int(c.users.payingActive), icon: DI.users, delta: dshDelta(c.users.payingActive, p.users.payingActive) })}
          ${pcard({ label: "Primeiros depósitos", tip: DEF.ftds, value: int(c.payments.ftd.count), icon: DI.user, tone: "gray", delta: dshDelta(c.payments.ftd.count, p.payments.ftd.count) })}
          ${pcard({ label: "Jogadores únicos", tip: DEF.players, value: int(c.users.players), icon: DI.users, delta: dshDelta(c.users.players, p.users.players) })}
          ${pcard({ label: "Hold %", tip: DEF.hold, value: pct(c.casino.hold, 2), icon: DI.percent, delta: dshDelta(c.casino.hold, p.casino.hold) })}
          ${pcard({ label: "Aposta média", tip: DEF.avgBet, value: money(c.casino.avgBet), icon: DI.wallet, tone: "orange", delta: dshDelta(c.casino.avgBet, p.casino.avgBet) })}
          ${pcard({ label: "GGR por player", tip: DEF.ggrPerPlayer, value: money(c.users.ggrPerPlayer), icon: DI.bag, delta: dshDelta(c.users.ggrPerPlayer, p.users.ggrPerPlayer) })}
        </div>`;
    }

    function dshPayments(S) {
      const c = S.current.payments, p = S.previous.payments;
      const d = c.deposits, pd = p.deposits, w = c.withdrawals, pw = p.withdrawals, f = c.ftd, pf = p.ftd;
      return dshSec("Depósitos", "Volume, eficiência operacional e saúde do funil.") + `<div class="mgrid">
          ${mcard({ label: "Completados", tip: DEF.depDone, value: int(d.completed), icon: DI.check, delta: dshDelta(d.completed, pd.completed) })}
          ${mcard({ label: "Volume líquido", tip: DEF.depVol, value: money(d.net), icon: DI.cash, delta: dshDelta(d.net, pd.net) })}
          ${mcard({ label: "Ticket médio", tip: DEF.depTicket, value: money(d.avgTicket), icon: DI.wallet, delta: dshDelta(d.avgTicket, pd.avgTicket) })}
          ${mcard({ label: "Depositantes únicos", tip: DEF.depositors, value: int(d.unique), icon: DI.users, delta: dshDelta(d.unique, pd.unique) })}
        </div>` + dshSec("FTD & retenção", "Tudo o que acontece depois do cadastro virar pagamento.") + `<div class="mgrid">
          ${mcard({ label: "FTDs", tip: DEF.ftds, value: int(f.count), icon: DI.user, tone: "gray", delta: dshDelta(f.count, pf.count) })}
          ${mcard({ label: "Participação FTD", tip: DEF.ftdShare, value: pct(f.share), icon: DI.percent, tone: "gray", delta: dshDelta(f.share, pf.share) })}
          ${mcard({ label: "Net dos FTDs", tip: DEF.ftdNet, value: money(f.net), icon: DI.cash, delta: dshDelta(f.net, pf.net) })}
          ${mcard({ label: "Ticket médio FTD", tip: DEF.ftdTicket, value: money(f.avgTicket), icon: DI.wallet, delta: dshDelta(f.avgTicket, pf.avgTicket) })}
          ${mcard({ label: "Redepositantes", tip: DEF.redep, value: int(f.redepositors), icon: DI.redo, delta: dshDelta(f.redepositors, pf.redepositors) })}
          ${mcard({ label: "Conversão FTD", tip: DEF.ftdConv, value: pct(f.conversion), icon: DI.percent, delta: dshDelta(f.conversion, pf.conversion) })}
          ${mcard({ label: "Depósitos por depositante", tip: DEF.perDepositor, value: num2(f.perDepositor), icon: DI.play, tone: "gray", delta: dshDelta(f.perDepositor, pf.perDepositor) })}
        </div>` + dshSec("Saques", "Volume, eficiência e pressão operacional sobre cash out.") + `<div class="mgrid">
          ${mcard({ label: "Completados", tip: DEF.wdDone, value: int(w.completed), icon: DI.check, delta: dshDelta(w.completed, pw.completed) })}
          ${mcard({ label: "Volume líquido", tip: DEF.wdVol, value: money(w.net), icon: DI.play, tone: "orange", delta: dshDelta(w.net, pw.net) })}
          ${mcard({ label: "Ticket médio", tip: DEF.wdTicket, value: money(w.avgTicket), icon: DI.wallet, delta: dshDelta(w.avgTicket, pw.avgTicket) })}
          ${mcard({ label: "Sacadores únicos", tip: DEF.withdrawers, value: int(w.unique), icon: DI.users, delta: dshDelta(w.unique, pw.unique) })}
        </div>`;
    }

    function dshWallet(S) {
      const n = S.native, nc = n.currency;
      const usdCell = (v) => (v == null ? `<span class="muted" title="Defina a cotação do dólar em Ajustes → Parâmetros">—</span>` : moneyIn(v, "USD"));
      return dshSec("Carteira & moedas", "Saldo agregado e distribuição dos fluxos por moeda de origem.") + `<div class="mgrid">
          ${mcard({ label: "Disponível", tip: DEF.available, value: money(S.wallet.available), icon: DI.wallet, tone: "orange" })}
          ${mcard({ label: "Bloqueado", tip: DEF.blocked, value: money(S.wallet.blocked), icon: DI.lock, tone: "gray" })}
          ${mcard({ label: "Total em carteira", tip: DEF.walletTotal, value: money(S.wallet.total), icon: DI.coins })}
        </div>` + dshSec(`Totais na moeda nativa (${escA(nc)})`, "") + `<div class="mgrid five">
          ${scard("Depósitos (Net)", moneyIn(n.deposits, nc), DI.cash)}
          ${scard("Saques (Net)", moneyIn(n.withdrawals, nc), DI.play)}
          ${scard("Casino Turnover", moneyIn(n.casinoTurnover, nc), DI.bars)}
          ${scard("Pagamento do cassino", moneyIn(n.casinoPayout, nc), DI.coins)}
          ${scard("Casino GGR", moneyIn(n.casinoGgr, nc), DI.trend)}
        </div><div class="tgrid">
          ${tbl("Depósitos por moeda", "Comparação por moeda de origem dos depósitos concluídos.", ["Moeda", "Solicitados", "Completados", "Net", "Fee"],
            S.byCurrency.map((b) => [b.currency, int(b.deposits.requested), int(b.deposits.completed), moneyIn(b.deposits.net, b.currency), moneyIn(b.deposits.fee, b.currency)]))}
          ${tbl("Saques por moeda", "Comparação por moeda de origem dos saques concluídos.", ["Moeda", "Solicitados", "Completados", "Net", "Fee"],
            S.byCurrency.map((b) => [b.currency, int(b.withdrawals.requested), int(b.withdrawals.completed), moneyIn(b.withdrawals.net, b.currency), moneyIn(b.withdrawals.fee, b.currency)]))}
          ${tbl("Carteira por moeda", "Distribuição do saldo disponível e bloqueado por moeda.", ["Moeda", "Disponível", "Bloqueado", "Total local", "Total USD"],
            S.byCurrency.map((b) => [b.currency, moneyIn(b.wallet.available, b.currency), moneyIn(b.wallet.blocked, b.currency), moneyIn(b.wallet.totalLocal, b.currency), usdCell(b.wallet.totalUsd)]))}
          ${tbl("Cassino por moeda", "Resultado operacional do cassino segmentado pela moeda do evento.", ["Moeda", "Apostas", "Players", "Turnover", "Payout", "Wins", "Refunds", "GGR"],
            S.byCurrency.map((b) => [b.currency, int(b.casino.bets), int(b.casino.players), moneyIn(b.casino.turnover, b.currency), moneyIn(b.casino.payout, b.currency), moneyIn(b.casino.wins, b.currency), moneyIn(b.casino.refunds, b.currency), ggrCell(b.casino.ggr, b.currency)]))}
        </div>`;
    }

    function dshCasinoPlayers(S) {
      const c = S.current.casino, p = S.previous.casino, u = S.current.users, pu = S.previous.users;
      const wd = S.current.payments.withdrawDeposit, pwd = S.previous.payments.withdrawDeposit;
      return dshSec("Resultado do cassino", "Volume, payout e eficiência da operação de jogo.") + `<div class="mgrid">
          ${mcard({ label: "Qtd. de apostas", tip: DEF.bets, value: int(c.bets), icon: DI.bars, delta: dshDelta(c.bets, p.bets) })}
          ${mcard({ label: "Qtd. de wins", tip: DEF.winsCount, value: int(c.winsCount), icon: DI.coins, delta: dshDelta(c.winsCount, p.winsCount) })}
          ${mcard({ label: "Turnover", tip: DEF.turnover, value: money(c.turnover), icon: DI.bars, tone: "gray", delta: dshDelta(c.turnover, p.turnover) })}
          ${mcard({ label: "Wins", tip: DEF.wins, value: money(c.wins), icon: DI.coins, delta: dshDelta(c.wins, p.wins) })}
          ${mcard({ label: "GGR", tip: DEF.ggr, value: money(c.ggr), icon: DI.trend, delta: dshDelta(c.ggr, p.ggr) })}
          ${mcard({ label: "Hold %", tip: DEF.hold, value: pct(c.hold), icon: DI.percent, delta: dshDelta(c.hold, p.hold) })}
          ${mcard({ label: "RTP %", tip: DEF.rtp, value: pct(c.rtp), icon: DI.percent, tone: "gray", delta: dshDelta(c.rtp, p.rtp) })}
          ${mcard({ label: "Aposta média", tip: DEF.avgBet, value: money(c.avgBet), icon: DI.wallet, delta: dshDelta(c.avgBet, p.avgBet) })}
        </div>` + dshSec("Jogadores & eficiência", "Crescimento da base, composição da audiência e monetização.") + `<div class="mgrid">
          ${mcard({ label: "Jogadores únicos", tip: DEF.players, value: int(u.players), icon: DI.users, delta: dshDelta(u.players, pu.players) })}
          ${mcard({ label: "Usuários ativos", tip: DEF.active, value: int(u.active), icon: DI.users, delta: dshDelta(u.active, pu.active) })}
          ${mcard({ label: "Pagantes ativos", tip: DEF.paying, value: int(u.payingActive), icon: DI.wallet, delta: dshDelta(u.payingActive, pu.payingActive) })}
          ${mcard({ label: "ARPU", tip: DEF.arpu, value: money(u.arpu), icon: DI.user, delta: dshDelta(u.arpu, pu.arpu) })}
          ${mcard({ label: "ARPPU", tip: DEF.arppu, value: money(u.arppu), icon: DI.wallet, delta: dshDelta(u.arppu, pu.arppu) })}
          ${mcard({ label: "GGR por player", tip: DEF.ggrPerPlayer, value: money(u.ggrPerPlayer), icon: DI.bag, tone: "orange", delta: dshDelta(u.ggrPerPlayer, pu.ggrPerPlayer) })}
          ${mcard({ label: "Withdraw / Deposit", tip: DEF.wdRatio, value: pct(wd), icon: DI.play, tone: "orange", delta: dshDelta(wd, pwd) })}
        </div>`;
    }

    /* Provedores: carteiras pré-pagas do agregador (desenho do painel da PlayFivers) + resultado por provedor. */
    function awReport(w, C) {
      const set = new Set(w.providers.map((p) => p.toUpperCase()));
      const rows = C.providers.filter((r) => set.has(r.name.toUpperCase()));
      if (!rows.length) return '<p class="hint" style="margin:.4rem 0 0">Sem apostas nos provedores desta carteira no período.</p>';
      const fee = (g) => (w.ggrPct == null ? "—" : money((Math.max(0, g) * w.ggrPct) / 100));
      return `<table class="dtab"><thead><tr><th>Provedor</th><th>Turnover</th><th>GGR</th><th>Custo (GGR %)</th></tr></thead><tbody>${
        rows.map((r) => `<tr><td>${escA(r.name)}</td><td>${money(r.turnover)}</td><td>${ggrCell(r.ggr)}</td><td>${fee(r.ggr)}</td></tr>`).join("")}</tbody></table>`;
    }
    function awCard(w, i, W, C) {
      const ratio = w.minBalance > 0 ? Math.min(1, w.balance / w.minBalance) : 1;
      const low = w.minBalance > 0 && w.balance < w.minBalance;
      const cls = low ? (w.balance < w.minBalance / 2 ? "bad" : "warn") : "";
      const badge = w.ggrPct == null ? '<span class="aw-badge unset">GGR %: definir</span>' : `<span class="aw-badge">GGR Atual: ${w.ggrPct.toLocaleString("pt-BR")}%</span>`;
      const meta = [
        `Provedores: ${w.providers.length ? w.providers.map(escA).join(", ") : "—"}`,
        `GGR no período ${moneyIn(w.periodGgr, "BRL")}`,
        w.estFee == null ? "custo: defina o GGR %" : `custo estimado ${moneyIn(w.estFee, "BRL")}`,
      ].join(" · ");
      const add = W.panelUrl
        ? `<a class="aw-btn solid" href="${escA(W.panelUrl)}" target="_blank" rel="noopener noreferrer">Adicionar Saldo</a>`
        : '<button type="button" class="aw-btn solid" data-goview="params" title="Defina a URL do painel em Ajustes → Parâmetros">Adicionar Saldo</button>';
      return `<div class="aw-card">
          <div class="aw-top"><b>${escA(w.name)}</b>${badge}</div>
          <div class="aw-row"><span>Saldo:</span><span class="aw-vals"><b>${moneyIn(w.balance, "BRL")}</b> / ${moneyIn(w.minBalance, "BRL")}</span></div>
          <div class="aw-bar" role="meter" aria-label="Saldo em relação ao mínimo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(ratio * 100)}"><i class="${cls}" style="width:${(ratio * 100).toFixed(1)}%"></i></div>
          <div class="aw-meta">${meta}${low ? '<span class="bad"> · abaixo do saldo mínimo</span>' : ""}</div>
          <div class="aw-actions">${add}<button type="button" class="aw-btn ghost" data-aw-games="${i}">Ver Jogos</button></div>
          <button type="button" class="aw-link" data-aw-report="${i}" aria-expanded="false" aria-controls="aw_rep_${i}">Ver relatório</button>
          <div class="aw-report" id="aw_rep_${i}" hidden>${awReport(w, C)}</div>
        </div>`;
    }
    function dshProviders(C, W) {
      let wallets;
      if (!W.configured) {
        wallets = `<div class="dsh-note"><b>PlayFivers não conectada.</b> Configure o token e o segredo do agente em <b>Ajustes → Instalação</b> e cadastre o IP do servidor no painel deles
          para ver aqui o saldo de cada carteira, o GGR % cobrado e o custo estimado do período.<br>
          <button type="button" class="dsh-btn" data-goview="install">Ir para Instalação</button></div>`;
      } else if (W.error) {
        wallets = `<div class="dsh-note"><b>Não foi possível ler as carteiras.</b> ${escA(W.error)}</div>`;
      } else if (!W.items.length) {
        wallets = '<div class="dsh-note">A PlayFivers não devolveu nenhuma carteira.</div>';
      } else {
        wallets = `<div class="aw-grid">${W.items.map((w, i) => awCard(w, i, W, C)).join("")}</div>`;
      }
      const t = C.totals;
      const rows = C.providers.map((r) => [escA(r.name), int(r.games), int(r.bets), int(r.players), money(r.turnover), money(r.payout), ggrCell(r.ggr), pct(r.hold), pct(r.rtp), pct(r.share)]);
      const foot = C.providers.length ? ["Total", int(C.providers.reduce((s, r) => s + r.games, 0)), int(t.bets), int(t.players), money(t.turnover), money(t.payout), ggrCell(t.ggr), pct(t.hold), pct(t.rtp), "100,0%"] : null;
      return dshSec("Carteiras do agregador", "Saldo pré-pago na PlayFivers, GGR % cobrado e custo estimado no período.") + wallets
        + dshSec("Resultado por provedor", "Turnover, payout e GGR do cassino por provedor no período.")
        + `<div class="tgrid">${tbl("Provedores", "Ordenados por turnover.", ["Provedor", "Jogos", "Apostas", "Jogadores", "Turnover", "Payout", "GGR", "Hold %", "RTP %", "Participação"], rows, foot, true)}</div>`;
    }

    /* Jogos: tabela com busca e ordenação. */
    const GAME_COLS = [["name", "Jogo"], ["provider", "Provedor"], ["bets", "Apostas"], ["players", "Jogadores"], ["turnover", "Turnover"], ["payout", "Payout"], ["ggr", "GGR"], ["hold", "Hold %"], ["rtp", "RTP %"], ["avgBet", "Aposta média"]];
    function dshGames() {
      return dshSec("Resultado por jogo", "Turnover, payout e GGR de cada jogo no período.") + `<div class="dsh-search">
          <input type="search" id="dsh_q" placeholder="Buscar jogo ou provedor…" value="${escA(dsh.games.q)}" aria-label="Buscar jogo ou provedor" />
          ${dsh.games.provs ? `<button type="button" class="chip-f" data-clear-provs aria-label="Tirar filtro da carteira">${escA(dsh.games.label || "Carteira")} ✕</button>` : ""}
        </div><div id="dsh_games_tbl"></div>`;
    }
    function renderGamesTable() {
      const el = $id("dsh_games_tbl");
      if (!el || !dshLast.C) return;
      const g = dsh.games, all = dshLast.C.games;
      const rows = all
        .filter((r) => (!g.q || r.name.toLowerCase().includes(g.q) || r.provider.toLowerCase().includes(g.q)) && (!g.provs || g.provs.includes(r.provider.toUpperCase())))
        .sort((a, b) => {
          const x = a[g.sort], y = b[g.sort];
          return (typeof x === "string" ? x.localeCompare(y, "pt-BR") : (x ?? 0) - (y ?? 0)) * g.dir;
        });
      const head = GAME_COLS.map(([k, l]) => `<th aria-sort="${g.sort === k ? (g.dir > 0 ? "ascending" : "descending") : "none"}"><button type="button" class="th-sort" data-sort="${k}">${l}${g.sort === k ? (g.dir > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("");
      const body = rows.length
        ? rows.map((r) => `<tr><td>${escA(r.name)}</td><td class="muted">${escA(r.provider)}</td><td>${int(r.bets)}</td><td>${int(r.players)}</td><td>${money(r.turnover)}</td><td>${money(r.payout)}</td><td>${ggrCell(r.ggr)}</td><td>${pct(r.hold)}</td><td>${pct(r.rtp)}</td><td>${money(r.avgBet)}</td></tr>`).join("")
        : `<tr><td colspan="${GAME_COLS.length}" class="muted">${all.length ? "Nenhum jogo com esse filtro." : "Sem apostas de cassino no período."}</td></tr>`;
      el.innerHTML = `<div class="tcard"><div class="tscroll"><table class="dtab"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
      if (!g.provs) document.querySelector("[data-clear-provs]")?.remove();
    }

    /* Esportes: o mesmo resultado para os bilhetes, mais o que está em aberto. */
    const SLIP_STATUS_PT = { OPEN: "Em aberto", WON: "Ganhou", LOST: "Perdeu", VOID: "Devolvida", CASHED_OUT: "Encerrada" };
    function dshSports(P) {
      const c = P.current, p = P.previous;
      return dshSec("Resultado das apostas esportivas", "Base caixa: a aposta conta no dia em que foi feita e o prêmio no dia em que foi pago.") + `<div class="mgrid">
          ${mcard({ label: "Qtd. de bilhetes", tip: "Bilhetes feitos no período (cada bilhete é uma aposta).", value: int(c.bets), icon: DI.ticket, delta: dshDelta(c.bets, p.bets) })}
          ${mcard({ label: "Apostadores únicos", tip: "Usuários únicos que fizeram bilhete no período.", value: int(c.players), icon: DI.users, delta: dshDelta(c.players, p.players) })}
          ${mcard({ label: "Turnover", tip: "Total apostado em bilhetes no período.", value: money(c.turnover), icon: DI.bars, tone: "gray", delta: dshDelta(c.turnover, p.turnover) })}
          ${mcard({ label: "Prêmios", tip: "Prêmios de bilhetes pagos no período.", value: money(c.wins), icon: DI.coins, delta: dshDelta(c.wins, p.wins) })}
          ${mcard({ label: "Devoluções", tip: "Apostas devolvidas (evento cancelado). Entram no payout.", value: money(c.refunds), icon: DI.redo, tone: "gray", delta: dshDelta(c.refunds, p.refunds) })}
          ${mcard({ label: "GGR", tip: "Turnover − (Prêmios + Devoluções).", value: money(c.ggr), icon: DI.trend, delta: dshDelta(c.ggr, p.ggr) })}
          ${mcard({ label: "Hold %", tip: "GGR ÷ Turnover.", value: pct(c.hold), icon: DI.percent, delta: dshDelta(c.hold, p.hold) })}
          ${mcard({ label: "RTP %", tip: "Payout ÷ Turnover.", value: pct(c.rtp), icon: DI.percent, tone: "gray", delta: dshDelta(c.rtp, p.rtp) })}
          ${mcard({ label: "Ticket médio", tip: "Turnover ÷ Qtd. de bilhetes.", value: money(c.avgBet), icon: DI.wallet, delta: dshDelta(c.avgBet, p.avgBet) })}
        </div>` + dshSec("Agora", "Bilhetes ainda em aberto (não dependem do período).") + `<div class="mgrid">
          ${mcard({ label: "Bilhetes em aberto", value: int(P.open.count), icon: DI.clock, tone: "gray" })}
          ${mcard({ label: "Valor apostado em aberto", value: money(P.open.stake), icon: DI.coins, tone: "orange" })}
          ${mcard({ label: "Prêmio máximo em aberto", tip: "Quanto a casa pagaria se todos os bilhetes em aberto ganhassem.", value: money(P.open.maxPayout), icon: DI.alert, tone: "orange" })}
        </div><div class="tgrid">
          ${tbl("Por situação", "Bilhetes feitos no período.", ["Situação", "Bilhetes", "Apostado", "Pago"], P.byStatus.map((r) => [SLIP_STATUS_PT[r.key] || escA(r.key), int(r.count), money(r.stake), money(r.payout)]))}
          ${tbl("Por tipo", "Bilhetes feitos no período.", ["Tipo", "Bilhetes", "Apostado"], P.byType.map((r) => [r.key === "MULTIPLE" ? "Acumulada" : "Simples", int(r.count), money(r.stake)]))}
        </div>`;
    }

    /* ── casca da tela: título, abas, filtros e período ── */
    function dshShell() {
      return `<div class="dsh" id="dsh_root">
        <div class="dsh-head">
          <div><h1>Dashboard</h1><p>Visão geral da operação de Cassino no período selecionado.</p></div>
          <button type="button" class="dsh-btn" id="dsh_export">${DI.download}Exportar CSV</button>
        </div>
        <div class="dsh-tabs" role="tablist" aria-label="Abas do dashboard" id="dsh_tabs"></div>
        <div class="dsh-toolbar" id="dsh_toolbar"></div>
        <div class="dsh-caption" id="dsh_caption" aria-live="polite"></div>
        <div class="dsh-body" id="dsh_body"><p class="hint">Carregando…</p></div>
      </div>`;
    }
    function renderDshChrome() {
      $id("dsh_tabs").innerHTML = DSH_TABS.map(([k, l, ic]) =>
        `<button type="button" role="tab" class="dsh-tab${dsh.tab === k ? " on" : ""}" aria-selected="${dsh.tab === k}" data-tab="${k}">${ic}${l}</button>`).join("");
      const opt = (attr, v, label, on) => `<button type="button" class="opt${on ? " on" : ""}" data-${attr}="${v}" aria-pressed="${on}">${label}</button>`;
      $id("dsh_toolbar").innerHTML = `
        <div class="seg" role="group" aria-label="Consolidação das moedas">${opt("mode", "usd", FLAG.US + "USD Geral", dsh.mode === "usd")}${tipBtn(DEF.mode, "USD Geral e Nativa")}${opt("mode", "native", "Nativa", dsh.mode === "native")}</div>
        <div class="seg" role="group" aria-label="Moeda">${opt("cur", "BRL", FLAG.BR + "BRL", dsh.cur === "BRL")}${opt("cur", "USD", FLAG.US + "USD", dsh.cur === "USD")}</div>
        <div class="dsh-pop-wrap">
          <button type="button" class="dsh-btn" id="dsh_period_btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="dsh_pop">${DI.calendar}${dmy(dsh.from)} – ${dmy(dsh.to)}</button>
          <div class="dsh-pop" id="dsh_pop" role="dialog" aria-label="Escolher período" hidden>
            <div class="presets">${DSH_PRESETS.map(([k, l]) => `<button type="button" data-preset="${k}" class="${dsh.preset === k ? "on" : ""}">${l}</button>`).join("")}</div>
            <div class="range">
              <label>De<input type="date" id="dsh_from" value="${dsh.from}" max="${spToday()}" /></label>
              <label>Até<input type="date" id="dsh_to" value="${dsh.to}" max="${spToday()}" /></label>
            </div>
            <div class="pop-actions"><span class="pop-err" id="dsh_pop_err" role="alert"></span><button type="button" class="dsh-btn" id="dsh_apply">Aplicar</button></div>
          </div>
        </div>
        <button type="button" class="dsh-btn" id="dsh_refresh">${DI.refresh}Atualizar</button>`;
    }
    function closeDshPop() {
      const pop = $id("dsh_pop");
      if (pop && !pop.hidden) { pop.hidden = true; $id("dsh_period_btn")?.setAttribute("aria-expanded", "false"); }
    }
    document.addEventListener("click", (e) => { if (!e.target.closest(".dsh-pop-wrap")) closeDshPop(); });

    function bindDsh() {
      const root = $id("dsh_root");
      root.addEventListener("click", (e) => {
        const t = e.target.closest("button, a");
        if (!t || !root.contains(t)) return;
        const d = t.dataset;
        if (d.tab) { dsh.tab = d.tab; return showDashboard(); }
        if (d.mode) { dsh.mode = d.mode; return showDashboard(); }
        if (d.cur) { dsh.cur = d.cur; return showDashboard(); }
        if (t.id === "dsh_period_btn") {
          const pop = $id("dsh_pop"), open = pop.hidden;
          pop.hidden = !open; t.setAttribute("aria-expanded", String(open));
          if (open) $id("dsh_from").focus();
          return;
        }
        if (d.preset) { dsh = { ...dsh, preset: d.preset, ...dshRange(d.preset) }; closeDshPop(); return showDashboard(); }
        if (t.id === "dsh_apply") {
          const from = $id("dsh_from").value, to = $id("dsh_to").value;
          if (!from || !to || from > to) { $id("dsh_pop_err").textContent = "Escolha o início antes do fim."; return; }
          dsh = { ...dsh, preset: "custom", from, to }; closeDshPop(); return showDashboard();
        }
        if (t.id === "dsh_refresh") { dshCache.clear(); return showDashboard(); }
        if (t.id === "dsh_export") return dshExport();
        if (d.goview) return goView(d.goview);
        if (d.awGames != null) {
          const w = dshLast.W?.items?.[Number(d.awGames)];
          if (w) { dsh.games = { ...dsh.games, q: "", provs: w.providers.map((p) => p.toUpperCase()), label: w.name }; dsh.tab = "games"; showDashboard(); }
          return;
        }
        if (d.awReport != null) {

    /* Exportar o que está na aba (cards e tabelas) em CSV com ";" — abre direto no Excel em pt-BR. */
    function dshExport() {
      const body = $id("dsh_body");
      if (!body) return;
      const tab = DSH_TABS.find(([k]) => k === dsh.tab)[1];
      const rows = [["Dashboard", tab], ["Período", `${dmy(dsh.from)} a ${dmy(dsh.to)}`, $id("dsh_caption").textContent], ["Moeda", `${dsh.mode === "usd" ? "USD Geral" : "Nativa"} · ${dsh.cur}`], []];
      body.querySelectorAll(".dsh-sec, .mcard, .pcard, .scard, .tcard, .aw-card").forEach((el) => {
        if (el.classList.contains("dsh-sec")) { rows.push([], [el.querySelector("h2")?.textContent || ""]); return; }
        if (el.classList.contains("tcard")) {
          const t = el.querySelector(".tcard-h b")?.textContent;
          if (t) rows.push([t]);
          el.querySelectorAll("tr").forEach((tr) => rows.push([...tr.children].map((c) => c.textContent.replace(/[▲▼]/g, "").trim())));
          return;
        }
        if (el.classList.contains("aw-card")) {
          rows.push([el.querySelector(".aw-top b")?.textContent || "", el.querySelector(".aw-vals")?.textContent.trim() || "", el.querySelector(".aw-badge")?.textContent || "", el.querySelector(".aw-meta")?.textContent.trim() || ""]);
          return;
        }
        const lbl = (el.querySelector(".mc-lbl, .s-l")?.textContent || "").replace("?", "").trim();
        const val = (el.querySelector(".mc-val, .s-v")?.textContent || "").trim();
        const pill = el.querySelector(".pill");
        const sign = pill?.classList.contains("down") ? "-" : pill?.classList.contains("up") ? "+" : "";
        rows.push([lbl, val, pill ? `${sign}${pill.textContent.trim()} vs. período anterior` : ""]);
      });
      const csv = "﻿" + rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      a.download = `dashboard-${dsh.tab}-${dsh.from}_${dsh.to}.csv`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }

      $id("wf_sports").checked = c.sports;

      wfOptions("wf_limit", WF_LIMITS.map((n) => [n, `${n} cards`]), c.limit);

        maxAgeDays: Number($id("wf_days").value),

        wfRender(d, dirty);

        $id("wf_msg").textContent = e.message;
        $id("wf_save").disabled = true;
      }

        wfFill(d.config);
        wfRender(d, false);

      fl.hidden = false;
      const r = btn.getBoundingClientRect();
      fl.style.left = r.right + 10 + "px";
      fl.style.top = Math.max(10, Math.min(r.top, innerHeight - fl.offsetHeight - 10)) + "px";
      fl.querySelector("button")?.focus();
    }
    function closeFlyout() { $id("flyout").hidden = true; flyoutFor = null; }

    document.addEventListener("click", (e) => {
      const rb = e.target.closest(".rail-item");
      if (rb) {
        const id = rb.dataset.group;
        if (id === "logout") return doLogout();
        if (id === "account") return openFlyout(rb);
        const g = NAV.find((x) => x.id === id);
        if (g.view) return goView(g.view);
        const first = groupItems(g)[0]?.[0];
        if (first) return goView(first);
        return;
      }
      const sn = e.target.closest(".sn-item");
      if (sn) return goView(sn.dataset.view);
      if (e.target.closest("#subClose")) { subCollapsed = true; localStorage.setItem("ca_sub_collapsed", "1"); renderSubnav(); return; }
      if (e.target.closest("#subExpand")) { subCollapsed = false; localStorage.setItem("ca_sub_collapsed", "0"); renderSubnav(); return; }
      const fb = e.target.closest("#flyout button");
      if (fb) return fb.dataset.act === "logout" ? doLogout() : null;
      if (!e.target.closest("#flyout")) closeFlyout();
    });
    window.addEventListener("hashchange", routeFromHash);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeFlyout(); closeDshPop(); hideTip(); } });

    // Bolinha vermelha na seção "Saques": saques pendentes de aprovação (fila de ação).
    async function refreshPending() {
      try { pendingPix = (await api("/admin/pix/summary")).pendingWithdrawals?.count || 0; syncRail(); } catch {}
    }
    async function loadMe() {
      try {
        const r = await fetch("/auth/me", { headers: { Authorization: `Bearer ${token}` } });
        if (r.ok) me = await r.json();
      } catch {}
    }
    function startApp() {
      $id("login").hidden = true;
      $id("app").hidden = false;
      renderRail();
      loadMe();
      refreshPending();
      clearInterval(pendingTimer);
      pendingTimer = setInterval(refreshPending, 60_000);
      if (location.hash && location.hash.length > 2) routeFromHash(); else goView("dashboard");
    }
    function doLogout() {
      token = "";
      localStorage.removeItem("ca_admin_token");
      clearInterval(pendingTimer);
      closeFlyout();
      $id("view").innerHTML = "";
      $id("app").hidden = true;
      $id("login").hidden = false;
    }

    // Marca no próprio painel (Ajustes → Marca): título da aba, login, ícone da barra e favicon.
    const ADMIN_LOGO_SVG = document.querySelector(".rail-logo").innerHTML;
    async function applyAdminBrand(b) {
      if (!b) { try { const r = await fetch("/site/brand"); if (!r.ok) return; b = await r.json(); } catch { return; } }
      if (!b || !b.name) return;
      document.title = `${b.name} — Admin`;
      const h = document.querySelector("#login h1"); if (h) h.textContent = `Painel ${b.name}`;
      const logo = b.iconUrl ? `<img src="${escA(b.iconUrl)}" alt="">` : ADMIN_LOGO_SVG;
      document.querySelectorAll(".login-logo, .rail-logo").forEach((el) => (el.innerHTML = logo));
      let fav = document.querySelector('link[rel="icon"]');
      if (b.iconUrl) { if (!fav) { fav = document.createElement("link"); fav.rel = "icon"; document.head.append(fav); } fav.href = b.iconUrl; }
      else if (fav) fav.remove();
    }
    applyAdminBrand();

    // Ponte para os módulos da Operação (ops-*.js), carregados logo abaixo.
    window.CA = {
      api, escA, svgI, tbl, tipBtn, dmy, int, num2, pct, moneyIn,
      money: (v) => moneyIn(v, "BRL"),
      DI, FLAG,
      goView, setActiveNav,
      view: () => $id("view"),
      bumpSeq: () => ++viewSeq,
      seq: () => viewSeq,
      registerViews: (o) => Object.assign(VIEWS, o),
      refreshPending,
      get me() { return me; },
      get token() { return token; },
    };
  </script>
  <script src="ops-core.js"></script>
  <script src="ops-pix.js"></script>
  <script src="ops-users.js"></script>
  <script src="ops-risk.js"></script>
  <script src="ops-finance.js"></script>
  <script src="ops-loyalty.js"></script>
  <script src="ops-incentives.js"></script>
  <script>if (token) startApp();</script>
</body>
</html>
